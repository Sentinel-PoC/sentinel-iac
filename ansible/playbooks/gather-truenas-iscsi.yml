---
# gather-truenas-iscsi.yml — Read-only verification playbook (OPS-1011)
#
# Runs the 'list' task group against the live TrueNAS to confirm connectivity
# and gather current iSCSI state (extents, targets, targetextents).
# Makes NO changes.
#
# Usage:
#   ansible-playbook ansible/playbooks/gather-truenas-iscsi.yml \
#     -e "truenas_api_token=$(vault kv get -field=api_token secret/truenas)" \
#     -e "truenas_url=https://192.168.12.205"
#
# Requires: Ansible host that can reach TrueNAS (iac-control or localhost w/ access).
# TrueNAS creds: vault kv get secret/truenas  (fields: url, api_token)
# Note: data.haist.farm may not resolve from workstation; use 192.168.12.205 directly.

- name: TrueNAS iSCSI gather — read-only state collection
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Override truenas_url if data.haist.farm not resolvable from runner
    truenas_url: "https://data.haist.farm"
    truenas_validate_certs: false
    # truenas_api_token: set via -e or inventory (from Vault)

    truenas_iscsi_tasks:
      - list

  pre_tasks:
    - name: Assert truenas_api_token is provided
      ansible.builtin.assert:
        that:
          - truenas_api_token is defined
          - truenas_api_token | length > 10
        fail_msg: >
          truenas_api_token must be set.
          Pass with: -e "truenas_api_token=$(vault kv get -field=api_token secret/truenas)"

  roles:
    - role: truenas-iscsi

  post_tasks:
    - name: Assert at least one extent returned
      ansible.builtin.assert:
        that:
          - truenas_iscsi_extents_result.json | length > 0
        fail_msg: "No extents returned — API connectivity issue or no iSCSI extents configured"
        success_msg: >-
          TrueNAS iSCSI connectivity confirmed.
          {{ truenas_iscsi_extents_result.json | length }} extent(s) found.
          {{ truenas_iscsi_targets_result.json | length }} target(s) found.
          {{ truenas_iscsi_targetextents_result.json | length }} LUN mapping(s) found.
