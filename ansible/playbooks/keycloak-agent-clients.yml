#
# Tracking: OPS-1163 (retire), originally OPS-335 Phase 2

- name: RETIRED — Keycloak agent clients (do not run — Keycloak decommissioned)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Abort — this playbook is retired
      ansible.builtin.fail:
        msg: >-
          keycloak-agent-clients.yml is RETIRED (OPS-1163).
          Keycloak (auth.208.haist.farm) is decommissioned.
          Agent OIDC clients are now managed via Authentik (auth-next.208.haist.farm).
          See vault-jwt-authentik role for the live agent JWT auth configuration.
