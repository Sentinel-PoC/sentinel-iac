---
# ai-tier1-lxc.yml — Provision ai-tier1 LXC with NVIDIA GPU access on pve4-alienware
# OPS-564: Plan G' Tier-1 inference substrate (Llama 3.2 3B + nomic-embed-text)
#
# This playbook applies the pve4-nvidia-gpu role to pve4-alienware, which:
#   1. Installs NVIDIA host driver (cuda-drivers-open) + nvidia-container-toolkit
#   2. Creates ai-tier1 LXC (Ubuntu 24.04, VMID 200, 192.168.12.80)
#   3. Configures cgroup2 device passthrough for /dev/nvidia*
#   4. Installs Ollama + pulls llama3.2:3b and nomic-embed-text
#   5. Verifies all 4 acceptance criteria (nvidia-smi, size_vram, idempotency, latency)
#
# Context:
#   pve4-alienware (192.168.12.60) — AMD Ryzen 9 5900x, 64 GB RAM, RTX 3060 LHR
#   Proxmox 9.1.1 (Debian trixie), kernel 6.17.2-1-pve
#   IOMMU passthrough NOT available (consumer BIOS, no AMD IOMMU IVRS table)
#   LXC cgroup-passthrough is the documented working path for this hardware.
#
# Prerequisites:
#   - pve4-alienware.yml must have been run first (APT repos, nftables, wazuh-agent)
#   - VAULT_TOKEN env var with access to secret/proxmox/ (for root password lookup)
#   - Internet access from pve4-alienware (NVIDIA CUDA repo + Ollama CDN downloads)
#
# Run dry-run (no changes):
#   ansible-playbook --check --diff -i ansible/inventory/hosts.yml \
#     --limit pve4-alienware ansible/playbooks/ai-tier1-lxc.yml
#
# Apply (all phases):
#   VAULT_TOKEN=<token> ansible-playbook -i ansible/inventory/hosts.yml \
#     --limit pve4-alienware ansible/playbooks/ai-tier1-lxc.yml
#
# Apply specific phase (tags):
#   --tags nvidia-driver        Host NVIDIA driver + container toolkit only
#   --tags lxc,provision       LXC create + cgroup config only
#   --tags ollama,inference    Ollama install + model pull only
#   --tags verify,acceptance   Acceptance criteria checks only
#
# Idempotency re-run (acceptance criterion AC-3):
#   Run twice with 'changed=0' on second run for tags: lxc,provision,ollama

- name: Provision ai-tier1 LXC with NVIDIA GPU cgroup-passthrough for Tier-1 inference
  hosts: pve4-alienware
  # ansible_user=root (host_vars) — PVE host, run directly as root, no become needed
  become: false
  gather_facts: true

  pre_tasks:
    - name: Verify target is pve4-alienware standalone Proxmox host
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - inventory_hostname == 'pve4-alienware'
        fail_msg: >
          ai-tier1-lxc.yml is scoped to pve4-alienware only.
          Target: {{ inventory_hostname }} ({{ ansible_distribution }}).
          This playbook must not run on cluster PVE nodes or non-Debian hosts.
      tags:
        - always

    - name: Verify nvidia_lxc_enabled is true (safety gate)
      ansible.builtin.assert:
        that:
          - nvidia_lxc_enabled | bool
        fail_msg: >
          nvidia_lxc_enabled=false in host_vars — this playbook is a no-op.
          Set nvidia_lxc_enabled=true in ansible/inventory/host_vars/pve4-alienware/main.yml
          before running ai-tier1-lxc.yml.
      tags:
        - always

    - name: Display provisioning target
      ansible.builtin.debug:
        msg: >-
          Provisioning ai-tier1 LXC (VMID {{ ai_tier1_lxc_id }}) on
          {{ inventory_hostname }} ({{ ansible_host }}) —
          {{ ansible_distribution }} {{ ansible_distribution_version }},
          kernel {{ ansible_kernel }}.
          GPU target: NVIDIA RTX 3060 LHR (12GB VRAM).
      tags:
        - always

  roles:
    - role: pve4-nvidia-gpu
      tags:
        - pve4-nvidia-gpu
        - tier1-inference

    - role: whisper-piper-host
      tags:
        - whisper-piper
        - wyoming

  post_tasks:
    - name: Record Ollama endpoint for downstream Plan G' consumers
      ansible.builtin.debug:
        msg:
          - "=== ai-tier1 Ollama endpoint ready ==="
          - "Base URL:  http://{{ ai_tier1_lxc_ip }}:{{ ollama_port | default(11434) }}"
          - "Models:    {{ ollama_models | join(', ') }}"
          - "GPU:       NVIDIA RTX 3060 LHR (12 GB VRAM) via LXC cgroup-passthrough"
          - ""
          - "Quick verify from any host on 192.168.12.0/24:"
          - "  curl http://{{ ai_tier1_lxc_ip }}:{{ ollama_port | default(11434) }}/api/ps"
          - "  # size_vram > 0 confirms GPU mode"
          - ""
          - "UNVERIFIED — requires Judge run against merged state for authoritative result."
      tags:
        - always
