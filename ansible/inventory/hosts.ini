# ==============================================================================
# OPS-366 FALLBACK INVENTORY — DO NOT USE AS PRIMARY SOURCE OF TRUTH
# ==============================================================================
# This file is a STATIC FALLBACK maintained only until all physical hosts below
# have Device records registered in NetBox DCIM (https://netbox.208.haist.farm).
#
# MIGRATION CHECKLIST — create NetBox Device record + primary IP for each:
#   [ ] iac-control       192.168.12.210  (LXC/VM — infrastructure control plane)
#   [ ] vault-server      192.168.12.206  (VM — HashiCorp Vault)
#   [ ] minio-bootstrap   192.168.12.58   (LXC — MinIO primary)
#   [ ] minio-replica     192.168.12.59   (LXC — MinIO replica)
#   [ ] pangolin-proxy    192.168.12.168  (VM — Pangolin/Traefik reverse proxy)
#   [ ] wazuh-server      192.168.12.100  (VM — Wazuh SIEM)
#   [ ] forgejo-server    192.168.12.70   (VM — Forgejo git forge)
#   [ ] config-server     10.0.0.2        (LXC — HA config/HAProxy)
#   [ ] pve               192.168.12.6    (Physical — Proxmox node)
#   [ ] 208-pve2          192.168.12.56   (Physical — Proxmox node)
#   [ ] pve3              192.168.12.57   (Physical — Proxmox node)
#   [ ] pve4-alienware    192.168.12.60   (Physical — Proxmox node, standalone)
#   [ ] 208-pi-001        192.168.12.197  (Physical — Raspberry Pi edge device)
#   [ ] seedbox-vm        192.168.12.69   (VM — seedbox)
#   [ ] workstation       127.0.0.1       (Physical — operator workstation, local)
#   [ ] authentik-server  192.168.12.83   (LXC — Authentik IdP)
#   [ ] ns1               192.168.12.253  (LXC — PowerDNS primary)
#   [ ] ns2               192.168.12.254  (LXC — PowerDNS secondary)
#   [ ] ts-personal-50    192.168.50.130  (LXC — Tailscale subnet router)
#   [ ] truenas-205       192.168.12.205  (Physical — TrueNAS SCALE NAS)
#   [ ] jellyfin-lxc      192.168.12.61   (LXC — Jellyfin media server)
#
# Once a host is in NetBox with a primary IP, check it off above and verify it
# appears in: ansible-inventory -i inventory/netbox_inventory.yml --list
#
# When ALL boxes are checked: remove hosts.ini from ansible.cfg inventory line.
# Tracking: OPS-366
# ==============================================================================

[iac_control]
# CIS note: net.ipv4.ip_forward=1 required for OKD cluster routing (vmbr1 bridge)
# firewall_enabled and extra rules defined in host_vars/iac-control/firewall.yml (OPS-167)
iac-control ansible_host=192.168.12.210 ansible_user=ubuntu

[vault]
# OPS-220: sshd_permit_root_login=no — CIS Level 1 requires "no" (not prohibit-password).
# ansible_user=koiakoia: root@vault-server rejects id_sentinel key (AuthorizedKeysFile none +
# AllowGroups=sudo blocks root SSH). koiakoia is the confirmed working non-root Ansible user.
# sshd_allow_groups and firewall_allowed_ports are managed in host_vars/vault-server/main.yml.
vault-server ansible_host=192.168.12.206 ansible_user=koiakoia sshd_permit_root_login=no

[minio]
# OPS-940: uses JIT cert for root SSH (id_sentinel not authorized on this LXC)
minio-bootstrap ansible_host=192.168.12.58 ansible_user=root sshd_permit_root_login=prohibit-password sshd_allow_groups="sudo root" firewall_allowed_ports='[22,9000,9001]' auditd_enabled=False ansible_ssh_private_key_file=~/.ssh/claude_jit ansible_ssh_common_args='-o StrictHostKeyChecking=no -o CertificateFile=~/.ssh/claude_jit-root-cert.pub -o PKCS11Provider=none -o IdentityAgent=none'

# OPS-940: minio-replica added — LXC 302 on pve3 (192.168.12.59, Ubuntu 25.04)
# Uses JIT cert auth (id_sentinel key does not have root access on this LXC).
[minio-replica]
minio-replica ansible_host=192.168.12.59 ansible_user=root sshd_permit_root_login=prohibit-password sshd_allow_groups="sudo root" firewall_allowed_ports='[22,9000,9001]' auditd_enabled=False ansible_ssh_private_key_file=~/.ssh/claude_jit ansible_ssh_common_args='-o StrictHostKeyChecking=no -o CertificateFile=~/.ssh/claude_jit-root-cert.pub -o PKCS11Provider=none -o IdentityAgent=none'

[seedbox]
seedbox-vm ansible_host=192.168.12.69 ansible_user=koiakoia firewall_allowed_ports='[22,8080]'

[pangolin]
# CIS exception: net.ipv4.ip_forward=1 required for Traefik reverse proxy function
pangolin-proxy ansible_host=192.168.12.168 ansible_user=ubuntu firewall_allowed_ports='[22,80,443]'

[wazuh]
wazuh-server ansible_host=192.168.12.100 ansible_user=koiakoia ansible_ssh_private_key_file=~/.ssh/id_wazuh firewall_allowed_ports='[22,443,1514,1515,55000]'

[forgejo]
forgejo-server ansible_host=192.168.12.70 ansible_user=koiakoia firewall_allowed_ports='[22,3000,2222]'

[config_server]
# LXC 300 on pve — HA failover for iac-control (HAProxy, dnsmasq, keepalived)
# Reachable from iac-control via OKD internal network (10.0.0.2) and via mgmt LAN (192.168.12.132)
config-server ansible_host=10.0.0.2 ansible_user=ubuntu firewall_allowed_ports='[22,53,80,443,6443,22623]'

[managed_vms:children]
iac_control
vault
minio
minio-replica
seedbox
pangolin
wazuh
forgejo
config_server

[all:vars]
# OPS-717: removed inventory-wide ansible_ssh_private_key_file pin (~/.ssh/id_sentinel).
# That key does not exist on the operator workstation; the pin overrides --private-key
# CLI flag and ANSIBLE_PRIVATE_KEY_FILE (inventory [all:vars] takes highest precedence
# outside of -e extra-vars). Removing it lets per-host key settings and CLI flags work
# as expected. Hosts with explicit ansible_ssh_private_key_file entries are unaffected.
ansible_become=true

# OPS-492: pve4-alienware standalone Proxmox node (NOT joining the 3-node cluster)
# Uses pve4_alienware_ed25519 key (host-specific key, confirmed at ~/.ssh/pve4_alienware_ed25519)
# ansible_become=false: ansible_user is root, no sudo needed
[pve-standalone]
pve4-alienware ansible_host=192.168.12.60 ansible_user=root ansible_become=false ansible_ssh_private_key_file=~/.ssh/pve4_alienware_ed25519

# proxmox group: targets both cluster nodes (hosts.yml) and standalone hosts
# Used by proxmox-host.yml playbook and ntp-infrastructure.yml Play 3
[proxmox:children]
pve-standalone

# OPS-507: ARM64 / Raspberry-Pi-class hosts. First entry: 208-pi-001, a
# bare-metal Raspberry Pi running Ubuntu 24.04 LTS on 192.168.12.197.
# Connects via Vault-signed JIT SSH cert (~/.ssh/claude_jit principal:
# koiakoia) — ansible_ssh_private_key_file set explicitly here since no
# inventory-wide default exists (OPS-717 removed the [all:vars] pin).
#
# Bootstrap caveat: first apply requires ansible_become_pass (koiakoia is
# in sudo group but not NOPASSWD on a fresh Pi). After common role
# applies, ubuntu user is created with NOPASSWD; subsequent runs can use
# -u ubuntu without a become password.
#
# Hostname on the live Pi is set to "208-PI-001" (uppercase) by the Pi
# Imager flow; ansible's `inventory_hostname` here is lowercase per the
# repo convention. The mismatch is cosmetic — ansible uses ansible_host
# for connection, inventory_hostname for play scoping.
[edge_devices]
208-pi-001 ansible_host=192.168.12.197 ansible_user=koiakoia ansible_ssh_private_key_file=~/.ssh/claude_jit

# OPS-533: Workstation (operator's primary desktop, CachyOS / Arch-family).
# Connection model: local — workstation is NOT a remote SSH target. sshd is
# intentionally inactive per the platform's "no inbound on the workstation"
# posture (operator break-glass goes through PVE qm-guest-exec, not LAN SSH).
# Plays scoped to `hosts: workstation` run from a tmux/Claude session on the
# workstation itself, hitting localhost via the local connection plugin.
# Not in [managed_vms] — this is a bare-metal desktop, not a Proxmox VM.
[workstation]
208pc001 ansible_host=127.0.0.1 ansible_connection=local ansible_user=koiakoia

# OPS-605: Authentik IdP host (Phase 1 — parallel to Keycloak, no cutover)
# LXC 300 on pve4-alienware (192.168.12.60). Provisioned 2026-05-14 by team-lead.
# 2 vCPU / 4 GB RAM / 40 GB disk, Ubuntu 24.04 LTS. VMID 300, bridge vmbr0,
# onboot=1, startup=order=3,up=60, unprivileged=1, features=keyctl=1,nesting=1.
#
# DEVIATION from OPS-605 brief recommendation (pve/pve3): pve3 + pve + 208-pve2 SSH
# access is broken from iac-control (id_ed25519 not in their authorized_keys —
# OPS-593 pain point — per-host key drift). pve4 was the only working host.
# OPS-598 DR Site (810) migration is FUTURE state (not active migrating), so colocating
# Authentik on pve4 alongside jellyfin (LXC 100) + home-assistant (LXC 201) is
# acceptable for now. Relocate once OPS-593-style centralized identity lands.
#
# Port 9000 must be reachable from Pangolin (192.168.12.168) for health checks.
[authentik]
authentik-server ansible_host=192.168.12.83 ansible_user=ubuntu firewall_allowed_ports='[22,9000]'

# OPS-1030: Jellyfin media server — LXC 100 on pve4-alienware (192.168.12.60).
# LAN-only per operator decision 2026-05-28 (OPS-1032 cancelled won't-do).
# JIT cert auth: sign with vault write ssh/sign/admin valid_principals=root
# ansible_become=false: ansible_user is root, no sudo needed.
[jellyfin]
jellyfin-lxc ansible_host=192.168.12.61 ansible_user=root ansible_become=false ansible_ssh_private_key_file=~/.ssh/claude_jit ansible_ssh_common_args='-o StrictHostKeyChecking=no -o CertificateFile=~/.ssh/claude_jit-cert.pub -o IdentitiesOnly=yes -o PKCS11Provider=none -o IdentityAgent=none'

# OPS-1123: scanopy-daemon LXC — dedicated ARP scanner for 192.168.12.0/24 VLAN.
# LXC 305 on pve4-alienware (192.168.12.60). Privileged LXC (NET_RAW for ARP).
# IP: 192.168.12.93 (static, vmbr0). Ubuntu 24.04 LTS. ubuntu user, id_sentinel key.
# Daemon runs as podman container with --network host --cap-add NET_RAW.
# SCANOPY_INTERFACES=eth0 (scope-restricted to 192.168.12.0/24 only per OPS-1123).
# SCANOPY_SERVER_URL=https://scanopy.208.haist.farm (via Pangolin -> OKD Route).
# firewall_allowed_ports: 22 (Ansible SSH), 60073 (daemon health port — LAN only).
[scanopy]
scanopy-daemon ansible_host=192.168.12.93 ansible_user=ubuntu firewall_allowed_ports='[22,60073]'

# OPS-670/OPS-669: PowerDNS HA nameservers (Phase 2 provisioning pending)
# ns1 = primary (LMDB master), ns2 = secondary (AXFR slave)
# LXC on pve1 + pve3 — VMID TBD in Phase 2.
# Both hosts run pdns-auth (127.0.0.1:5300) + pdns-recursor (:53 on LXC IP).
# firewall_allowed_ports: 22 (mgmt SSH), 53 (DNS), 8081 (pdns API, loopback-only — not opened externally)
[nameservers]
ns1 ansible_host=192.168.12.253 ansible_user=ubuntu firewall_allowed_ports='[22,53]'
ns2 ansible_host=192.168.12.254 ansible_user=ubuntu firewall_allowed_ports='[22,53]'

# OPS-759: TrueNAS SCALE NAS appliance. Direct root SSH, no sudo needed.
# JIT cert auth: sign with vault write ssh/sign/admin valid_principals=koiakoia
# ansible_become=false: ansible_user is root, no sudo wrapper needed.
# Note: TrueNAS middleware regenerates sshd_config on restart — truenas-jit-ssh
# role handles CA persistence via /etc/ script + systemd drop-in + POSTINIT.
[truenas]
truenas-205 ansible_host=192.168.12.205 ansible_user=root ansible_become=false ansible_ssh_private_key_file=~/.ssh/claude_jit

# OPS-504: CT320 Tailscale subnet router on Personal VLAN 50.
# LXC 320 on 208-pve2 (192.168.12.56). LXC IP: 192.168.50.130 (Personal VLAN).
# Tailscale node: ts-personal-50, advertises 192.168.12.0/24 into the tailnet.
# Also hosts derper.service (self-hosted DERP, OPS-499).
#
# Connectivity: Personal VLAN (192.168.50.x) is blocked inbound from Homelab
# VLAN (192.168.12.x) by UCG ZBF — no direct SSH from iac-control.
# Reach via ProxyJump through 208-pve2 (root@192.168.12.56).
# If pve2 SSH is unavailable (OPS-593 key drift), apply via:
#   ssh root@192.168.12.56 pct exec 320 -- tailscale up --accept-routes=false \
#     --advertise-routes=192.168.12.0/24 --accept-dns=false --hostname=ts-personal-50
#
# accept-routes=false persists the OPS-499 asymmetric-routing fix: CT320 must
# NOT accept routes from other tailnet peers (e.g. 208-pi-001 subnet router),
# or the Pi cannot reach the DERP keepalive path (haist-home region 900).
[ts_nodes]
ts-personal-50 ansible_host=192.168.50.130 ansible_user=root ansible_become=false ansible_ssh_private_key_file=~/.ssh/id_ed25519 ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyJump=root@192.168.12.56'
