---
# OPS-492: pve4-alienware standalone Proxmox host (192.168.12.60)
# Proxmox 9.1.1, kernel 6.17.2-1-pve, AMD 5900x / 64GB / NVIDIA RTX 3060 LHR
# NOT a member of the existing 3-node PVE cluster

# --- SSH access ---
# Root login required for Proxmox direct management (cert-only, no password)
sshd_permit_root_login: "prohibit-password"
# Allow root group so Proxmox's own sshd access control doesn't block root
sshd_allow_groups: "sudo root"

# --- Firewall ---
# proxmox-host role handles nftables firewall; do NOT also run UFW via common
# (they conflict — UFW manages nf_tables chains differently than direct nftables)
firewall_enabled: false

# --- nftables (proxmox-host role) ---
# Standalone node: no cluster peers, empty cluster_nodes set
pve_cluster_nodes: []

# --- Wazuh ---
wazuh_manager_ip: "192.168.12.100"

# --- AIDE ---
aide_enabled: true

# --- Auditd ---
# Proxmox runs on bare metal — auditd is supported (not an LXC restriction)
auditd_enabled: true

# --- NTP ---
# Uses iac-control (192.168.12.210) as primary NTP server per platform standard
ntp_servers:
  - "192.168.12.210"
  - "192.168.12.206"

# --- GPU Passthrough (OPS-492 Phase 4) ---
# pve4-alienware is the dedicated Jellyfin GPU passthrough host.
# GPU: NVIDIA GA106 GeForce RTX 3060 LHR (PCI 0a:00.0)
# Audio: NVIDIA GA106 HD Audio (PCI 0a:00.1)
# PCI IDs confirmed via lspci -nn on 2026-05-10.
# OPERATOR PIVOT (2026-05-10): gpu_passthrough_enabled flipped to false.
# Alienware Aurora Ryzen Edition consumer BIOS does not expose AMD IOMMU
# (no IVRS ACPI table; BIOS 2.10.0 is current with no toggle exposed).
# GPU passthrough is not feasible on this hardware. Role is shelved for
# future GPU host use; Jellyfin transcoding will use the 5900x CPU instead.
# Phase 5 reshapes to: create OKD worker VM on pve4 + Jellyfin nodeSelector.
gpu_passthrough_enabled: false
gpu_passthrough_pci_ids:
  - "10de:2504"  # GA106 GeForce RTX 3060 LHR
  - "10de:228e"  # GA106 HD Audio Controller
cpu_iommu_arch: "amd"  # AMD 5900x — amd_iommu=on iommu=pt
gpu_passthrough_reboot_on_change: true

# --- GPU LXC cgroup-passthrough (OPS-564) ---
# Plan G' Tier-1 inference substrate: NVIDIA RTX 3060 via LXC device passthrough.
# IOMMU/VFIO passthrough is NOT available (consumer BIOS, no AMD IOMMU IVRS table;
# gpu_passthrough_enabled remains false above).
#
# LXC cgroup-passthrough approach:
#   - NVIDIA driver IS installed on host (opposite of VFIO which blacklists it)
#   - ai-tier1 LXC gets /dev/nvidia* via cgroup2 device allow + bind mounts
#   - Ollama runs native inside LXC; GPU visible via host kernel driver
#
# CONFLICT NOTE: proxmox-gpu-passthrough role must stay at gpu_passthrough_enabled=false
# on this host. If VFIO were ever enabled here, it would blacklist nvidia drivers
# and break the LXC passthrough. The two approaches are mutually exclusive.
#
# IP 192.168.12.80 reserved for ai-tier1 in the management subnet.
nvidia_lxc_enabled: true

ai_tier1_lxc_id: 200
ai_tier1_lxc_name: "ai-tier1"
ai_tier1_lxc_ip: "192.168.12.80"
ai_tier1_lxc_cidr: "24"
ai_tier1_lxc_gateway: "192.168.12.1"
ai_tier1_lxc_bridge: "vmbr0"
ai_tier1_lxc_cores: 8
ai_tier1_lxc_memory: 16384     # 16 GB (MiB)
ai_tier1_lxc_swap: 4096        # 4 GB (MiB)
ai_tier1_lxc_rootfs: "local-lvm:64"
ai_tier1_lxc_nameserver: "192.168.12.210"  # iac-control dnsmasq
ai_tier1_lxc_searchdomain: "208.haist.farm"
ai_tier1_lxc_unprivileged: 0   # Privileged required for device passthrough

# Ollama — NVIDIA RTX 3060 has 12GB GDDR6 VRAM
# OLLAMA_GPU_OVERHEAD=1GiB leaves ~11GB for models
# llama3.2:3b  ≈ 2.0 GB quantized; nomic-embed-text ≈ 274 MB
ollama_gpu_overhead: "1GiB"
ollama_context_length: 8192
ollama_models:
  - llama3.2:3b
  - nomic-embed-text

# ── Home Assistant LXC (OPS-585) ─────────────────────────────────────────────
# VMID 201 — home-assistant LXC (Ubuntu 24.04, 192.168.12.81, privileged).
# Privileged required for Docker-in-LXC (Docker CE + HA Container image).
# Distinct from ai-tier1 (VMID 200, 192.168.12.80) which is for Ollama inference.
#
# CONFLICT NOTE: ai_tier1_lxc_unprivileged=0 (already privileged) for GPU passthrough.
# ha_lxc_id=201 is a separate container; no resource conflict with ai-tier1.
ha_lxc_id: 201
ha_lxc_name: "home-assistant"
ha_lxc_ip: "192.168.12.81"
ha_lxc_cidr: "24"
ha_lxc_gateway: "192.168.12.1"
ha_lxc_bridge: "vmbr0"
ha_lxc_cores: 4
ha_lxc_memory: 4096     # 4 GB (MiB)
ha_lxc_swap: 1024       # 1 GB (MiB)
ha_lxc_template_storage: "local"
ha_lxc_rootfs_storage: "local-lvm"
ha_lxc_rootfs_size: "32"
ha_lxc_ostemplate: "ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
ha_lxc_nameserver: "192.168.12.210"  # iac-control dnsmasq
ha_lxc_searchdomain: "208.haist.farm"
ha_lxc_unprivileged: 0  # Privileged required for Docker-in-LXC
ha_image: "ghcr.io/home-assistant/home-assistant:stable"
ha_config_dir: "/config"
ha_timezone: "America/Indiana/Indianapolis"

