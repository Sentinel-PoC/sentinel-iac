# ── Frigate NVR LXC (OPS-840 / OPS-956 / OPS-958) ────────────────────────────
# VMID 203 — Frigate NVR LXC (Ubuntu 24.04, 192.168.12.91, unprivileged).
# OPS-840: Initial Frigate LXC deployment (2026-05-22)
# OPS-956: Camera config (3x Reolink via Hub) + iSCSI recordings storage (2026-05-26)
# OPS-958: Stream stability fixes (2026-05-27):
#   - reolink_01 URL: Preview_01 → h264Preview_01 (TrackMix Hub firmware requirement)
#   - reolink_01 preset: preset-rtsp-restream → preset-rtsp-generic (TrackMix HEVC)
#   - All streams: #input=rtsp/tcp appended (prevent RTP sequence errors on UDP)
#
# Storage: 300GiB iSCSI LUN from TrueNAS (192.168.12.205)
#   IQN: iqn.2026-03.farm.haist:frigate-recordings
#   Mounted on pve4 host at /mnt/pve/frigate-recordings
#   Bind-mounted into LXC 203 at /opt/frigate/storage → /media/frigate in container
#
# Cameras (Reolink Home Hub at 192.168.100.150, camera VLAN):
#   reolink_01: Hub ch00, h264Preview_01 (Reolink TrackMix — Side door, battery/solar)
#   reolink_02: Hub ch01, Preview_02 (Reolink Atlas 1 — Back yard, battery)
#   reolink_03: Hub ch02, Preview_03 (Reolink Atlas 2 — Front, battery)
#
# All cameras are battery-powered: stream ~3-5 min then sleep.
# Frigate watchdog reconnects automatically when cameras wake on motion.
# OPS-958: Atlas cameras will still cycle on battery sleep (Hub-side fix required:
#   enable continuous recording via Reolink Hub Web UI — operator action item).
frigate_lxc_id: 203
frigate_lxc_name: "frigate"
frigate_lxc_ip: "192.168.12.91"

frigate_cameras:
  - name: reolink_01
    comment: "Hub channel 0, h264Preview_01 (Reolink TrackMix — Side door, battery/solar)"
    main_stream: "h264Preview_01_main"
    sub_stream: "h264Preview_01_sub"
    ffmpeg_input_args: "preset-rtsp-generic"
    enabled: true
  - name: reolink_02
    comment: "Hub channel 1, Preview_02 (Reolink Atlas 1 — Back yard, battery)"
    main_stream: "Preview_02_main"
    sub_stream: "Preview_02_sub"
    enabled: true
  - name: reolink_03
    comment: "Hub channel 2, Preview_03 (Reolink Atlas 2 — Front, battery)"
    main_stream: "Preview_03_main"
    sub_stream: "Preview_03_sub"
    enabled: true

# ── TrueNAS iSCSI SSD Storage Pool (OPS-972 / child of OPS-961 Decision B.2) ─
# Expose 200 GiB thin zvol from TrueNAS SSD pool to pve4 via raw iSCSI.
# Storage type: pvesm iscsi (no LVM-thin layer, no QEMU snapshots).
#
# TrueNAS portal: 192.168.12.205:3260 (id=1)
# Named initiator group (pve4 IQN only — not open [] group):
#   iqn.1993-08.org.debian:01:fa92d8ebe1d7 (confirmed live 2026-05-26)
#
# TrueNAS side prerequisites (manual, documented in OPS-972):
#   1. Dataset:   SSD/iscsi-pve4
#   2. Zvol:      SSD/iscsi-pve4/pve4-ssd (200 GiB, sparse=true, LZ4, STANDARD)
#   3. Extent:    pve4-ssd -> zvol/SSD/iscsi-pve4/pve4-ssd (type DISK, rpm=SSD, blocksize=512)
#   4. Initiator: named group with iqn.1993-08.org.debian:01:fa92d8ebe1d7
#   5. Target:    iqn.2026-03.farm.haist:pve4-ssd (portal id=1, named initiator group id)
#   6. Targetextent: target <-> extent, LUN 0
pve4_iscsi_storage_enabled: true
pve4_iscsi_portal: "192.168.12.205"
pve4_iscsi_port: 3260
pve4_iscsi_target_iqn: "iqn.2026-03.farm.haist:pve4-ssd"
pve4_iscsi_storage_name: "pve4-ssd"
pve4_iscsi_storage_content: "images"

# ── LVM-thin layer over iSCSI SSD block device (OPS-979) ─────────────────────
# Optional LVM-thin pool on top of the raw iSCSI LUN (pve4_iscsi_storage_name).
# Enables per-VM disk allocation within the 200 GiB SSD-backed LUN.
#
# Background: raw pvesm iscsi can't allocate sub-images. LVM-thin on top
# (pvcreate /dev/sdc → vgcreate → lvcreate --thinpool → pvesm add lvmthin)
# is required for qmrestore and qm disk allocation to work.
#
# Verified on pve4 (2026-05-26) during OPS-976 wazuh VM migration.
# Pool live: pve4-ssd-vg/pve4-ssd-pool (~199 GiB, SSD-backed TrueNAS zvol)
pve4_iscsi_lvmthin_enabled: true
pve4_iscsi_lvmthin_device: "/dev/sdc"         # iSCSI block device after login
pve4_iscsi_lvmthin_vg: "pve4-ssd-vg"
pve4_iscsi_lvmthin_pool: "pve4-ssd-pool"
pve4_iscsi_lvmthin_storage_name: "pve4-ssd-thin"

# ── Authentik OIDC realm (OPS-981) ────────────────────────────────────────────
# Enable pveum realm add for Authentik SSO on this standalone PVE node.
# pve4-alienware is NOT a cluster member so it can't inherit the cluster realm.
# Realm applied 2026-05-27 via OPS-981 (live) and codified here.
# Operator: after first SSO login, run:
#   pveum aclmod / --user <email>@authentik --role PVEAdmin
pve4_authentik_realm_enabled: true
pve4_authentik_issuer_url: "https://auth-next.208.haist.farm/application/o/proxmox/"
pve4_authentik_username_claim: "email"
pve4_authentik_groups_claim: "groups"
# client_id and client_secret sourced at runtime from Vault:
#   secret/authentik/clients/pve (client_id, client_secret)
#   Created by OPS-634; issuer pk=20 on Authentik LXC 300 (192.168.12.83)
