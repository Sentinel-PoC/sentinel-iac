---
# Ansible inventory for Sentinel infrastructure
# NIST CM-2 compliant configuration management

all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.12.6
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_become: false

        208-pve2:
          ansible_host: 192.168.12.56
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_become: false

        pve3:
          ansible_host: 192.168.12.57
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_become: false

        pve4-alienware:
          ansible_host: 192.168.12.60
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/pve4_alienware_ed25519
          ansible_become: false

    infrastructure_control:
      hosts:
        iac-control:
          ansible_host: 192.168.12.210
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

          # Network Configuration
          primary_interface: eth0
          okd_interface: ens19
          okd_network: 10.0.0.0/24
          okd_gateway_ip: 10.0.0.1
          okd_dhcp_ip: 10.0.0.10
          management_network: 192.168.12.0/24

          # Service Binding
          haproxy_stats_bind: 127.0.0.1:9000
          squid_port: 3128

    infrastructure_ha:
      hosts:
        config-server:
          ansible_host: 10.0.0.2
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

          # Network Configuration
          cluster_interface: eth0
          management_interface: eth1
          config_server_ip: 10.0.0.2

    vault:
      hosts:
        vault-server:
          ansible_host: 192.168.12.206
          ansible_user: koiakoia
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

    mirror_registry:
      hosts:
        mirror-registry-01:
          ansible_host: 192.168.12.215
          ansible_user: rocky
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

          # Network Configuration — OPS-148 dual-home (2026-04-28)
          mgmt_interface: eth0
          mgmt_ip: 192.168.12.215
          mgmt_cidr: "192.168.12.215/24"
          okd_interface: eth1
          okd_ip: 10.0.0.50
          okd_cidr: "10.0.0.50/24"
          okd_bridge: vmbr1
          okd_nic_mac: "BC:24:11:F8:01:9C"
          pve_host: 208-pve2
          pve_vmid: 215

          # Service
          mirror_quay_port: 8443

    storage:
      hosts:
        minio-bootstrap:
          ansible_host: 192.168.12.58
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true
        minio-replica:
          ansible_host: 192.168.12.59
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

    seedbox:
      hosts:
        seedbox-vm:
          ansible_host: 192.168.12.69
          ansible_user: koiakoia
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

    wazuh:
      hosts:
        wazuh-server:
          ansible_host: 192.168.12.100
          ansible_user: koiakoia
          ansible_ssh_private_key_file: ~/.ssh/id_wazuh
          ansible_become: true

    # OPS-605 Phase 1: Authentik IdP (parallel to Keycloak via OPS-604 dual-running)
    # LXC 300 on pve4-alienware (192.168.12.60). 192.168.12.83/24, gw .12.1.
    # Provisioned 2026-05-14 by team-lead (pve3/pve/208-pve2 SSH inaccessible
    # per OPS-593 key drift; pve4 is fallback). Authentik Docker Compose stack
    # served via Pangolin route auth-next.208.haist.farm.
    authentik:
      hosts:
        authentik-server:
          ansible_host: 192.168.12.83
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_become: true

    # OPS-288: NTP infrastructure groups
    # ntp_servers — hosts running chrony in server mode, upstream to time.nist.gov
    ntp_servers:
      hosts:
        iac-control:
          ansible_host: 192.168.12.210
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true
        vault-server:
          ansible_host: 192.168.12.206
          ansible_user: koiakoia
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

    # OPS-669: PowerDNS HA nameservers (ns1 primary, ns2 secondary)
    # LXC provisioned by ansible/playbooks/powerdns-provision.yml (roles/powerdns-lxc)
    # Full per-host config: ansible/inventory/host_vars/ns1/ and host_vars/ns2/
    # Live apply blocked on SEC-74 (SSH key auth gap on pve4-alienware/pve3); IaC ready.
    nameservers:
      hosts:
        ns1:
          ansible_host: 192.168.12.253
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

        ns2:
          ansible_host: 192.168.12.254
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

    # OPS-779: Forgejo server (192.168.12.70) — Docker Compose git forge
    # Targeted by ansible/playbooks/forgejo-server.yml (hosts: forgejo).
    # OPS-783: host was missing from inventory; forgejo-server.yml matched
    # no hosts and OPS-779 role codification was inert.
    forgejo:
      hosts:
        forgejo-server:
          ansible_host: 192.168.12.70
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true

    # ntp_clients — all other hosts; use iac-control + vault-server as NTP sources
    # OPS-569: Suricata NIDS hosts — receives port-mirror SPAN traffic (OPS-567)
    # Co-location with Zeek is supported; both roles target the same nids group.
    # Placeholder host: replace with actual NIDS VM IP when provisioned.
    # capture interface (eth1) must be the mirror port configured in OPS-567.
    nids:
      hosts:
        nids-sensor-01:
          ansible_host: 192.168.12.168
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_sentinel
          ansible_become: true
          # Override capture interface if needed:
          # suricata_capture_interface: "eth1"

    ntp_clients:
      children:
        proxmox: {}
        storage: {}
        seedbox: {}
        wazuh: {}
        infrastructure_ha: {}
        authentik: {}
        nameservers: {}
        forgejo: {}
        nids: {}
