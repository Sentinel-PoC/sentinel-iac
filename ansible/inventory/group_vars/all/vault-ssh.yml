---
# Vault SSH CA public key - deployed to all managed hosts as /etc/ssh/trusted-ca.pem
# Allows Vault-signed SSH certificates to authenticate (JIT SSH).
# Source: vault read -field=public_key ssh/config/ca
# NIST IA-2, IA-3: Vault PKI-backed certificate authentication
#
# To rotate: run `vault write ssh/config/ca generate_signing_key=true` (destroys old CA),
# then update this value and re-run the common role on all hosts.
# yamllint disable rule:line-length
vault_ssh_ca_public_key: >-
  ssh-rsa 
# yamllint enable rule:line-length

# OPS-125: Break-glass authorized-keys (Vault-independent fallback SSH).
# These keys are deployed to /etc/ssh/break-glass-authorized-keys/%u by the
# common role. Used ONLY when Vault is down and JIT cert renewal is impossible.
#
# Key: operator YubiKey PIV slot 9a (ECDSA P-256, hardware-backed).
#   - Private key never leaves the YubiKey device.
#   - This is the RAW public key (not a Vault-signed cert); auth works
#     even when vault-server is offline.
#   - Source: cat ~/.ssh/yubikey-piv.pub on operator workstation (2026-05-29)
#   - To rotate: generate new PIV keypair on YubiKey, update this entry,
#     re-run common role on all hosts.
# yamllint disable rule:line-length
sshd_break_glass_authorized_keys:
  ubuntu:
    - "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBAEG5TPVy7NfNU6dsJGxUkY5t8+z0LcHxPK/QgF4OPMfY9ghpaA5uzqfGBOTOQ4TooHxUr4Zltb4vjRhVWfonJU= koiakoia-yubikey-piv"
  koiakoia:
    - "ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBAEG5TPVy7NfNU6dsJGxUkY5t8+z0LcHxPK/QgF4OPMfY9ghpaA5uzqfGBOTOQ4TooHxUr4Zltb4vjRhVWfonJU= koiakoia-yubikey-piv"
# yamllint enable rule:line-length
