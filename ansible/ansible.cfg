[defaults]
# OPS-366: NetBox SoT migration — inventory sources
# TARGET STATE: inventory/netbox_inventory.yml only (NetBox as single SoT).
# CURRENT STATE: hosts.ini is kept as FALLBACK-ONLY until all physical hosts
# (iac-control, vault-server, proxmox nodes, minio, pangolin, wazuh, forgejo,
# config-server, edge/ts nodes) have Device records in NetBox DCIM with primary
# IPs assigned. Once all physical hosts are in NetBox, remove hosts.ini from
# this line.
# RATIONALE: Removing hosts.ini before NetBox devices exist would break all
# plays targeting physical infra. The documented exception is intentional and
# tracked — not a silent shortcut.
# See: https://plane.208.haist.farm — OPS-366 acceptance criteria.
inventory = inventory/hosts.ini,inventory/netbox_inventory.yml
roles_path = roles
private_key_file = ~/.ssh/id_sentinel
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
