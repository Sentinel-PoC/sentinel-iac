---
galaxy_info:
  role_name: vault_jwt_spire
  author: sentinel-iac
  description: >-
    Enables the Vault JWT auth method at auth/jwt-spire/ trusting the
    spire-oidc-discovery-provider deployed in OPS-537 (Phase 4.4a), and
    creates 4 JWT roles (sentinel-worker/-planner/-judge/-scribe) bound to
    SPIFFE IDs spiffe://agents.haist.farm/sentinel/{role}. Each role maps
    to the existing per-agent Vault policy (agent-worker/-planner/-judge/
    -scribe) authored by OPS-345 — NO policy files are created or modified
    by this role. Phase boundary: authored, not yet consumed; agent
    migration to JWT-SVID-issued tokens is Phase 4.5.
  license: proprietary
  min_ansible_version: "2.15"

dependencies: []

# Collection version requirements declared in ansible/requirements.yml
# (community.hashi_vault is installed in the iac-control runtime
# environment; pattern matches roles/vault-jwt-agents).
collections:
  - community.hashi_vault
  - community.general
