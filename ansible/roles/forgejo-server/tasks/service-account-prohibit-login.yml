---
# OPS-338: Manage prohibit_login state for sentinel service accounts
#
# INTENT
# ------
# sentinel-worker, sentinel-planner, sentinel-scribe should have
# prohibit_login=true once agents are updated to use SSH-key git push.
# sentinel-judge keeps prohibit_login=false (uses API token for merge ops).
#
# PREREQUISITE
# ------------
# claude-config PR worker/OPS-338-agent-ssh-clone-url must be merged and
# agents updated to use ssh://git@forgejo.208.haist.farm:22/... before
# running this task for worker/planner/scribe.
#
# CURRENT STATE (as of OPS-338 worker run 2026-05-29)
# ---------------------------------------------------------
# sentinel-worker  : prohibit_login=false  (restored pending agent update)
# sentinel-planner : prohibit_login=false  (restored pending agent update)
# sentinel-scribe  : prohibit_login=false  (restored pending agent update)
# sentinel-judge   : prohibit_login=false  (intentional; keep as-is)
#
# TARGET STATE (after claude-config PR merged)
# --------------------------------------------
# sentinel-worker  : prohibit_login=true
# sentinel-planner : prohibit_login=true
# sentinel-scribe  : prohibit_login=true
# sentinel-judge   : prohibit_login=false

- name: "OPS-338 | Set prohibit_login=true for sentinel-worker (SSH-only after agent update)"
  ansible.builtin.uri:
    url: "{{ forgejo_api_url }}/api/v1/admin/users/sentinel-worker"
    method: PATCH
    headers:
      Authorization: "token {{ forgejo_admin_token }}"
      Content-Type: application/json
    body_format: json
    body:
      prohibit_login: true
      login_name: sentinel-worker
      source_id: 0
    status_code: 200
  tags: [forgejo, service-accounts, prohibit-login, never]

- name: "OPS-338 | Set prohibit_login=true for sentinel-planner (SSH-only after agent update)"
  ansible.builtin.uri:
    url: "{{ forgejo_api_url }}/api/v1/admin/users/sentinel-planner"
    method: PATCH
    headers:
      Authorization: "token {{ forgejo_admin_token }}"
      Content-Type: application/json
    body_format: json
    body:
      prohibit_login: true
      login_name: sentinel-planner
      source_id: 0
    status_code: 200
  tags: [forgejo, service-accounts, prohibit-login, never]

- name: "OPS-338 | Set prohibit_login=true for sentinel-scribe (SSH-only after agent update)"
  ansible.builtin.uri:
    url: "{{ forgejo_api_url }}/api/v1/admin/users/sentinel-scribe"
    method: PATCH
    headers:
      Authorization: "token {{ forgejo_admin_token }}"
      Content-Type: application/json
    body_format: json
    body:
      prohibit_login: true
      login_name: sentinel-scribe
      source_id: 0
    status_code: 200
  tags: [forgejo, service-accounts, prohibit-login, never]

- name: "OPS-338 | Verify prohibit_login=false is retained for sentinel-judge"
  ansible.builtin.uri:
    url: "{{ forgejo_api_url }}/api/v1/users/sentinel-judge"
    method: GET
    headers:
      Authorization: "token {{ forgejo_admin_token }}"
    status_code: 200
  register: judge_user_state
  failed_when: judge_user_state.json.prohibit_login != false
  tags: [forgejo, service-accounts, prohibit-login, verify]
