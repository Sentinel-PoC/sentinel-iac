---
# OPS-338: SSH key provisioning for sentinel service accounts
#
# PURPOSE
# -------
# Forgejo's design for service accounts that must never UI-login is:
#   SSH-key git push + prohibit_login=true
#
# This task file documents the declarative intended state for each sentinel
# service account's SSH key in Forgejo. The IMPERATIVE bootstrap (key
# generation + Vault write + Forgejo POST) was performed directly by the
# OPS-338 worker on 2026-05-29.
#
# Run this task only when re-provisioning from scratch (e.g. Forgejo rebuild).
# Normal operation: keys exist in Vault + Forgejo; prohibit_login state is
# managed by the service-account-prohibit-login.yml companion task.
#
# VAULT PATHS
# -----------
# Private key:  secret/forgejo-{role}  field: ssh_private_key
# Public key:   secret/forgejo-{role}  field: ssh_public_key
# API token:    secret/forgejo-{role}  field: api_token
#
# SSH CLONE URL
# -------------
# Agents must clone repos via SSH, not HTTPS Basic auth:
#   ssh://git@forgejo.208.haist.farm:22/sentinel-admin/<repo>.git
# Private key is fetched from Vault at agent startup and written to a
# per-session identity file (never persisted to shared disk).
#
# FORGEJO USER STATE (target)
# ---------------------------
# sentinel-worker  : prohibit_login=true  (git push via SSH key only)
# sentinel-planner : prohibit_login=true  (git push via SSH key only)
# sentinel-scribe  : prohibit_login=true  (git push via SSH key only)
# sentinel-judge   : prohibit_login=false (uses API token; SSH key added for
#                    consistency but prohibit_login stays false per issue)
#
# NOTE: prohibit_login=true also blocks API token auth. Final revert of
# worker/planner/scribe to prohibit_login=true must follow the claude-config
# agent definition update (PR: worker/OPS-338-agent-ssh-clone-url).
# Until that PR is merged and agents are updated, these accounts remain at
# prohibit_login=false to avoid breaking CI/CD.

- name: "OPS-338 | Fetch SSH public keys from Vault for all sentinel service accounts"
  community.hashi_vault.vault_kv2_get:
    path: "forgejo-{{ item }}"
    engine_mount_point: secret
  register: sentinel_vault_results
  loop:
    - worker
    - planner
    - scribe
    - judge
  tags: [forgejo, service-accounts, ssh-keys]

- name: "OPS-338 | Assert SSH public key is present in Vault for each account"
  ansible.builtin.assert:
    that:
      - "sentinel_vault_results.results | selectattr('item', 'equalto', item) | map(attribute='data.data.ssh_public_key') | first | length > 0"
    fail_msg: "Vault path secret/forgejo-{{ item }} missing ssh_public_key field"
  loop:
    - worker
    - planner
    - scribe
    - judge
  tags: [forgejo, service-accounts, ssh-keys]

- name: "OPS-338 | Ensure ed25519 SSH key is registered in Forgejo for sentinel-{{ item }}"
  ansible.builtin.uri:
    url: "{{ forgejo_api_url }}/api/v1/admin/users/sentinel-{{ item }}/keys"
    method: POST
    headers:
      Authorization: "token {{ forgejo_admin_token }}"
      Content-Type: application/json
    body_format: json
    body:
      key: "{{ sentinel_vault_results.results | selectattr('item', 'equalto', item) | map(attribute='data.data.ssh_public_key') | first }}"
      read_only: false
      title: "sentinel-{{ item }}-ed25519-ops338"
    status_code: [201, 422]  # 422 = key already exists; idempotent
  loop:
    - worker
    - planner
    - scribe
    - judge
  tags: [forgejo, service-accounts, ssh-keys, never]  # 'never' tag: run only on explicit re-provision
