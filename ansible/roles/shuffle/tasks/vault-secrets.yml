---
# vault-secrets.yml — OPS-573
# Reads Shuffle credentials and Telegram bot config from Vault, sets them as
# role-scoped facts for use in templates and API calls.
#
# Vault path layout (operator initializes before first run):
#   secret/shuffle
#     .admin_password      — Shuffle admin UI password
#     .api_token           — Shuffle API token (auto-generated on first start; update after)
#     .oidc_client_secret  — Keycloak shuffle client secret
#   secret/telegram/bot
#     .token               — Telegram Bot API token (standing bot)
#     .chat_id             — Telegram channel/chat ID for confirm gates

- name: Assert vault_token is available
  ansible.builtin.assert:
    that:
      - vault_token | default('') | length > 0
    fail_msg: >-
      vault_token is required. Pass via:
        -e vault_token=$(VAULT_ADDR=https://vault.208.haist.farm vault kv get -field=... secret/shuffle)
      or inject via environment before running the playbook.

- name: Read Shuffle secrets from Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: shuffle
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    auth_method: token
  register: shuffle_vault_data
  no_log: true

- name: Read Telegram bot config from Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: telegram/bot
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    auth_method: token
  register: shuffle_telegram_vault_data
  no_log: true

- name: Set Shuffle credential facts from Vault
  ansible.builtin.set_fact:
    shuffle_admin_password: "{{ shuffle_vault_data.secret.admin_password }}"
    shuffle_api_token: "{{ shuffle_vault_data.secret.api_token | default('') }}"
    shuffle_oidc_client_secret: "{{ shuffle_vault_data.secret.oidc_client_secret | default('') }}"
    shuffle_telegram_bot_token: "{{ shuffle_telegram_vault_data.secret.token }}"
    shuffle_telegram_chat_id: "{{ shuffle_telegram_vault_data.secret.chat_id }}"
  no_log: true
