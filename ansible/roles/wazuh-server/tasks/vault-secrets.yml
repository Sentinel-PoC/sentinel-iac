---
# vault-secrets.yml — SEC-95
# Reads wazuh-dashboard kibanaserver password from Vault and sets it as a
# role-scoped fact so opensearch_dashboards.yml.j2 is never deployed with the
# well-known default password.
#
# Vault path: secret/wazuh/dashboard (field: kibanaserver_password)
# Seed with:
#   vault kv patch secret/wazuh/dashboard kibanaserver_password=<new-value>
# Also update the opensearch indexer's internal_users.yml kibanaserver hash when rotating.
#
# Usage — pass vault_token when running the playbook:
#   ansible-playbook -i inventory/hosts.yml playbooks/wazuh-server.yml \
#     -e vault_token=<scoped-vault-token>

- name: Assert vault_token is available (wazuh-server secrets)
  ansible.builtin.assert:
    that:
      - vault_token | default('') | length > 0
    fail_msg: >-
      vault_token is required. Pass via:
        -e vault_token=<scoped-vault-token>
      The kibanaserver password cannot be read from Vault without it.
  tags: [wazuh-server, vault-secrets]

- name: Read kibanaserver password from Vault (secret/wazuh/dashboard)
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: wazuh/dashboard
    url: "{{ vault_addr | default('https://vault.208.haist.farm') }}"
    token: "{{ vault_token }}"
    auth_method: token
  register: _wazuh_dashboard_secrets
  tags: [wazuh-server, vault-secrets]

- name: Set kibanaserver password fact from Vault
  ansible.builtin.set_fact:
    wazuh_dashboard_kibanaserver_password: "{{ _wazuh_dashboard_secrets.secret.kibanaserver_password }}"
  tags: [wazuh-server, vault-secrets]
