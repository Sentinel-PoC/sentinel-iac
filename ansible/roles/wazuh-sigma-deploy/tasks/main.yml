---
# wazuh-sigma-deploy tasks — OPS-574
#
# Deploys SIGMA-compiled Wazuh XML rules to the Wazuh manager.
# Rules are generated by sentinel-sigma-rules/pipeline/sigma2wazuh.py
# and live in Wazuh rule ID namespace 200000-209999.
#
# Called from: ansible/playbooks/sigma-deploy.yml
# Called by CI: .forgejo/workflows/sigma-pipeline.yml (deploy job, main branch only)
#
# Follows the pattern established in roles/wazuh-server/tasks/main.yml:
#   - ansible.builtin.copy to upgrade-safe path
#   - notify Restart wazuh-manager
#   - post-deploy health check

- name: Verify SIGMA compiled rules source file exists
  # Fail fast if CI didn't produce the compiled output — prevents deploying stale/empty rules
  ansible.builtin.stat:
    path: "{{ sigma_compiled_src }}"
  register: sigma_src_stat

- name: Fail if compiled rules source not found
  ansible.builtin.fail:
    msg: >
      SIGMA compiled rules not found at {{ sigma_compiled_src }}.
      Ensure sigma2wazuh.py ran successfully in the CI pipeline.
  when: not sigma_src_stat.stat.exists

- name: Validate compiled rules XML is well-formed
  # Quick XML parse to catch malformed output before deploying.
  # python3 -c exits non-zero on parse error.
  ansible.builtin.command:
    cmd: >
      python3 -c "
      import xml.etree.ElementTree as ET
      with open('{{ sigma_compiled_src }}') as f:
          content = f.read()
      lines = content.split('\n')
      for i, l in enumerate(lines):
          if l.strip().startswith('<group'):
              content = '\n'.join(lines[i:])
              break
      root = ET.fromstring(content)
      rules = root.findall('rule')
      print(f'SIGMA XML valid: {len(rules)} rules parsed')
      "
  register: xml_validate
  changed_when: false

- name: Show XML validation result
  ansible.builtin.debug:
    msg: "{{ xml_validate.stdout }}"

- name: Deploy SIGMA compiled rules to Wazuh manager
  # Upgrade-safe path: /var/ossec/etc/rules/ is not touched by wazuh-manager updates.
  # Rule IDs 200000-209999 are reserved for SIGMA-derived rules (see OPS-574).
  # Restart is deferred via handler to batch with other changes.
  ansible.builtin.copy:
    src: "{{ sigma_compiled_src }}"
    dest: "{{ wazuh_sigma_rules_dest }}"
    owner: "{{ wazuh_rules_owner }}"
    group: "{{ wazuh_rules_group }}"
    mode: "{{ wazuh_rules_mode }}"
    remote_src: false
  notify: Restart wazuh-manager

- name: Check Wazuh manager configuration syntax
  # wazuh-control check verifies configuration and rule syntax without restarting.
  # Run before handler fires to catch rule XML errors early.
  ansible.builtin.command:
    cmd: /var/ossec/bin/wazuh-logtest -U "{{ wazuh_sigma_rules_dest }}" 2>&1 | head -5
  register: wazuh_config_check
  changed_when: false
  failed_when: false  # Don't fail if logtest returns non-zero (it may on dry-run)

- name: Verify Wazuh manager service is running post-deploy
  ansible.builtin.service_facts:

- name: Confirm wazuh-manager is active
  ansible.builtin.assert:
    that:
      - ansible_facts.services['wazuh-manager.service'] is defined
      - ansible_facts.services['wazuh-manager.service'].state == 'running'
    fail_msg: "wazuh-manager is not running after SIGMA rule deployment"
    success_msg: "wazuh-manager is running after SIGMA rule deployment"
