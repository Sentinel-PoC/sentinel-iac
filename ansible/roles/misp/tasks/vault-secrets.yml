---
# vault-secrets.yml — OPS-571
# Reads MISP credentials from Vault (secret/misp) and sets them as
# role-scoped facts for use in templates and API calls.
#
# Vault path layout (initialized on first run; operator rotates values):
#   secret/misp.db_password         — MariaDB misp user password
#   secret/misp.db_root_password    — MariaDB root password
#   secret/misp.admin_password      — MISP admin UI password
#   secret/misp.admin_key           — MISP admin API key (UUID format)
#   secret/misp.oidc_client_secret  — Keycloak MISP client secret
#   secret/misp.redis_password      — Redis AUTH password (may be empty)
#   secret/misp.greynoise_api_key   — GreyNoise Community API key
#   secret/misp.abuseipdb_api_key   — AbuseIPDB v2 API key
#   secret/misp.sync_key            — (future) MISP sync API key for federation

- name: Assert vault_token is available
  ansible.builtin.assert:
    that:
      - vault_token | default('') | length > 0
    fail_msg: >-
      vault_token is required. Pass via:
        -e vault_token=$(VAULT_ADDR=https://192.168.12.206:8200 VAULT_SKIP_VERIFY=true vault kv get -field=... secret/misp)
      or inject via environment before running the playbook.

- name: Read MISP secrets from Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: misp
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    auth_method: token
  register: misp_vault_data
  no_log: true

- name: Set MISP credential facts from Vault
  ansible.builtin.set_fact:
    misp_db_password: "{{ misp_vault_data.secret.db_password }}"
    misp_db_root_password: "{{ misp_vault_data.secret.db_root_password }}"
    misp_admin_password: "{{ misp_vault_data.secret.admin_password }}"
    misp_admin_key: "{{ misp_vault_data.secret.admin_key }}"
    misp_oidc_client_secret: "{{ misp_vault_data.secret.oidc_client_secret | default('') }}"
    misp_redis_password: "{{ misp_vault_data.secret.redis_password | default('redispassword') }}"
    misp_greynoise_api_key: "{{ misp_vault_data.secret.greynoise_api_key | default('') }}"
    misp_abuseipdb_api_key: "{{ misp_vault_data.secret.abuseipdb_api_key | default('') }}"
  no_log: true
