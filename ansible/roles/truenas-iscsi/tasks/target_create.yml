---
# truenas-iscsi | target_create — idempotent iSCSI target creation (OPS-1011)
#
# Creates an iSCSI target if one with truenas_iscsi_target_name does not already exist.
# Will not modify an existing target.
# Requires truenas_iscsi_target_name.
#
# The full IQN presented to initiators is:
#   iqn.2005-10.org.freenas.ctl:<truenas_iscsi_target_name>
#
# Portal group:    truenas_iscsi_target_portal_id (default 1 — OKD iSCSI portal)
# Initiator group: truenas_iscsi_target_initiator_id (default null = allow all)

- name: truenas-iscsi/target_create | validate required variables
  ansible.builtin.assert:
    that:
      - truenas_iscsi_target_name | length > 0
    fail_msg: "truenas_iscsi_target_name must be set (e.g. 'okd-minio-replica-pg')"

- name: truenas-iscsi/target_create | fetch all targets to check for existing
  ansible.builtin.uri:
    url: "{{ truenas_url }}/api/v2.0/iscsi/target"
    method: GET
    headers:
      Authorization: "Bearer {{ truenas_api_token }}"
    validate_certs: "{{ truenas_validate_certs }}"
    status_code: 200
  register: truenas_iscsi_all_targets
  changed_when: false

- name: truenas-iscsi/target_create | check if target already exists by name
  ansible.builtin.set_fact:
    truenas_iscsi_target_existing: >-
      {{
        truenas_iscsi_all_targets.json
        | selectattr('name', 'equalto', truenas_iscsi_target_name)
        | list
      }}

- name: truenas-iscsi/target_create | create target (skip if exists)
  ansible.builtin.uri:
    url: "{{ truenas_url }}/api/v2.0/iscsi/target"
    method: POST
    headers:
      Authorization: "Bearer {{ truenas_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ truenas_iscsi_target_name }}"
      alias: "{{ truenas_iscsi_target_alias if truenas_iscsi_target_alias | length > 0 else omit }}"
      mode: "ISCSI"
      groups:
        - portal: "{{ truenas_iscsi_target_portal_id | int }}"
          initiator: "{{ truenas_iscsi_target_initiator_id }}"
          authmethod: "{{ truenas_iscsi_target_authmethod }}"
          auth: null
    validate_certs: "{{ truenas_validate_certs }}"
    status_code: 200
  when: truenas_iscsi_target_existing | length == 0
  register: truenas_iscsi_target_create_result

- name: truenas-iscsi/target_create | report outcome
  ansible.builtin.debug:
    msg: >-
      {{
        'Created target: ' + truenas_iscsi_target_name
        + ' portal=' + truenas_iscsi_target_portal_id | string
        + ' initiator=' + (truenas_iscsi_target_initiator_id | string)
        if truenas_iscsi_target_existing | length == 0
        else 'Target already exists (no-op): ' + truenas_iscsi_target_name
        + ' id=' + (truenas_iscsi_target_existing | first).id | string
      }}
  changed_when: false
