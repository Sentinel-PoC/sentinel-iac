---
# tasks/main.yml -- tailscale-subnet-router role (OPS-671)
#
# Install and configure Tailscale as a subnet router.
# Tested on Ubuntu 24.04 LTS (noble) aarch64 -- 208-pi-001.
#
# Manual steps this role replaces (from OPS-671 prior-agent runbook):
#   1. curl -fsSL https://tailscale.com/install.sh | sh
#   2. echo 'net.ipv4.ip_forward=1' >> /etc/sysctl.d/99-tailscale.conf
#      echo 'net.ipv6.conf.all.forwarding=1' >> /etc/sysctl.d/99-tailscale.conf
#      sysctl -p /etc/sysctl.d/99-tailscale.conf
#   3. tailscale up --advertise-routes=192.168.12.0/24 --accept-dns=false \
#        --hostname=208-pi-001 --authkey=<key>
#
# NOTE: Tailnet lock signing is NOT automated. After first-run auth succeeds,
# the operator must approve this node in the Tailscale admin console and, if
# tailnet lock is enabled, sign with a hardware key. Until the node is approved,
# the advertised subnet routes are visible but NOT active in the tailnet.
# See: https://tailscale.com/kb/1226/tailnet-lock

# -- Phase 1: APT repository --------------------------------------------------

- name: Install APT transport prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [tailscale, apt]

- name: Download Tailscale APT signing key (binary GPG keyring)
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_keyring_url }}"
    dest: "{{ tailscale_apt_keyring_dest }}"
    mode: "0644"
    owner: root
    group: root
  tags: [tailscale, apt]

- name: Download Tailscale APT repository list
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_repo_url }}"
    dest: "{{ tailscale_apt_repo_dest }}"
    mode: "0644"
    owner: root
    group: root
  register: tailscale_repo_list
  tags: [tailscale, apt]

- name: Update APT cache after repo addition
  # noqa no-handler -- APT cache update must precede the package install task;
  # a handler fires at end-of-play, after apt install would already fail.
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo_list.changed
  tags: [tailscale, apt]

# -- Phase 2: Package install -------------------------------------------------

- name: Install tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: false  # already updated above if repo was new
  tags: [tailscale, apt]

# -- Phase 3: IP forwarding (required for subnet routing) ---------------------

- name: Deploy sysctl config for IP forwarding
  ansible.builtin.copy:
    dest: "{{ tailscale_sysctl_conf }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # OPS-671 -- Tailscale subnet router requires IP forwarding
      # https://tailscale.com/kb/1019/subnets
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  notify: reload sysctl
  tags: [tailscale, sysctl]

- name: Flush handlers to apply sysctl before tailscale up
  ansible.builtin.meta: flush_handlers
  tags: [tailscale, sysctl]

# -- Phase 4: tailscaled service ----------------------------------------------

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
    daemon_reload: true
  tags: [tailscale, systemd]

# -- Phase 5: Authentication and subnet route advertisement -------------------

- name: Check Tailscale backend state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false
  tags: [tailscale, auth]

- name: Parse Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{ (tailscale_status_raw.stdout | from_json).BackendState | default('Unknown') }}
  when:
    - tailscale_status_raw.rc == 0
    - tailscale_status_raw.stdout | length > 0
  tags: [tailscale, auth]

- name: Default backend state to Unknown if status failed
  ansible.builtin.set_fact:
    tailscale_backend_state: "Unknown"
  when: >
    tailscale_status_raw.rc != 0 or
    tailscale_status_raw.stdout | length == 0
  tags: [tailscale, auth]

# -- Phase 5a: Auth key acquisition (NeedsLogin / Unknown) --------------------
#
# Two sub-paths, controlled by tailscale_use_oauth (default: false):
#   5a-i  (static): fetch pre-generated auth_key from secret/tailscale
#   5a-ii (OAuth):  obtain access token via OAuth, then generate one-time key
#                   via Tailscale API (devices:create scope) -- OPS-503
#
# Both paths converge to tailscale_effective_authkey before tailscale up.

# -- 5a-i: Static auth key path (tailscale_use_oauth: false) ------------------

- name: Fetch Tailscale auth key from Vault (static path, first-time auth only)
  ansible.builtin.command:
    cmd: >
      vault kv get -field={{ tailscale_auth_key_vault_field }}
      {{ tailscale_auth_key_vault_path }}
  environment:
    VAULT_ADDR: "https://192.168.12.206:8200"
    VAULT_SKIP_VERIFY: "true"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  register: tailscale_auth_key_raw
  changed_when: false
  no_log: true
  when:
    - tailscale_backend_state != 'Running'
    - not (tailscale_use_oauth | bool)
  tags: [tailscale, auth, vault]

- name: Set effective auth key from static Vault key
  ansible.builtin.set_fact:
    tailscale_effective_authkey: "{{ tailscale_auth_key_raw.stdout | trim }}"
  no_log: true
  when:
    - tailscale_backend_state != 'Running'
    - not (tailscale_use_oauth | bool)
  tags: [tailscale, auth]

# -- 5a-ii: OAuth auth key path (tailscale_use_oauth: true) -- OPS-503 --------

- name: Fetch Tailscale OAuth client_id from Vault (OAuth path)
  ansible.builtin.command:
    cmd: >
      vault kv get -field={{ tailscale_oauth_client_id_field }}
      {{ tailscale_oauth_vault_path }}
  environment:
    VAULT_ADDR: "https://192.168.12.206:8200"
    VAULT_SKIP_VERIFY: "true"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  register: tailscale_oauth_client_id_raw
  changed_when: false
  no_log: true
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_use_oauth | bool
  tags: [tailscale, auth, vault, oauth]

- name: Fetch Tailscale OAuth client_secret from Vault (OAuth path)
  ansible.builtin.command:
    cmd: >
      vault kv get -field={{ tailscale_oauth_client_secret_field }}
      {{ tailscale_oauth_vault_path }}
  environment:
    VAULT_ADDR: "https://192.168.12.206:8200"
    VAULT_SKIP_VERIFY: "true"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  register: tailscale_oauth_client_secret_raw
  changed_when: false
  no_log: true
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_use_oauth | bool
  tags: [tailscale, auth, vault, oauth]

- name: Obtain Tailscale OAuth access token (client_credentials flow)
  ansible.builtin.uri:
    url: "{{ tailscale_oauth_token_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: "client_credentials"
      client_id: "{{ tailscale_oauth_client_id_raw.stdout | trim }}"
      client_secret: "{{ tailscale_oauth_client_secret_raw.stdout | trim }}"
    return_content: true
    status_code: 200
  register: tailscale_oauth_token_response
  no_log: true
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_use_oauth | bool
  tags: [tailscale, auth, oauth]

- name: Generate one-time Tailscale auth key via API (OAuth path)
  # Uses the access_token obtained above to create a short-lived (5 min),
  # single-use, preauthorized auth key via the Tailscale keys API.
  # The key is consumed immediately by the next tailscale up task.
  ansible.builtin.uri:
    url: "{{ tailscale_oauth_authkeys_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_oauth_token_response.json.access_token }}"
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: "{{ tailscale_oauth_authkey_reusable | bool }}"
            ephemeral: "{{ tailscale_oauth_authkey_ephemeral | bool }}"
            preauthorized: "{{ tailscale_oauth_authkey_preauthorized | bool }}"
            tags: []
      expirySeconds: "{{ tailscale_oauth_authkey_expiry_seconds | int }}"
      description: "{{ tailscale_oauth_authkey_description }}"
    return_content: true
    status_code: 200
  register: tailscale_oauth_generated_key
  no_log: true
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_use_oauth | bool
  tags: [tailscale, auth, oauth]

- name: Set effective auth key from OAuth-generated key
  ansible.builtin.set_fact:
    tailscale_effective_authkey: "{{ tailscale_oauth_generated_key.json.key }}"
  no_log: true
  when:
    - tailscale_backend_state != 'Running'
    - tailscale_use_oauth | bool
  tags: [tailscale, auth]

# -- 5a-iii: First-time auth using effective auth key (both paths) ------------

- name: Authenticate and advertise routes (first-time auth)
  ansible.builtin.command:
    cmd: >
      tailscale up
      --authkey={{ tailscale_effective_authkey }}
      --advertise-routes={{ tailscale_advertise_routes }}
      --accept-dns={{ tailscale_accept_dns | string | lower }}
      --hostname={{ tailscale_hostname }}
      {{ '--accept-routes=' + (tailscale_accept_routes | string | lower)
         if tailscale_accept_routes is not none else '' }}
      --timeout=30s
  no_log: true
  changed_when: true
  when: tailscale_backend_state != 'Running'
  tags: [tailscale, auth]

# -- Phase 5b: Re-apply settings when already authenticated ------------------

- name: Re-apply subnet route advertisement (already authenticated)
  # tailscale up without --authkey reconfigures an already-authenticated node.
  # This ensures routes and hostname stay correct after any manual changes.
  # If tailscale_accept_routes is set (non-null), --accept-routes is passed
  # explicitly so the setting persists across role re-applies (OPS-504).
  ansible.builtin.command:
    cmd: >
      tailscale up
      --advertise-routes={{ tailscale_advertise_routes }}
      --accept-dns={{ tailscale_accept_dns | string | lower }}
      --hostname={{ tailscale_hostname }}
      {{ '--accept-routes=' + (tailscale_accept_routes | string | lower)
         if tailscale_accept_routes is not none else '' }}
      --timeout=30s
  changed_when: false
  when: tailscale_backend_state == 'Running'
  tags: [tailscale, auth]

# -- Phase 6: Smoke check -----------------------------------------------------

- name: Verify tailscaled is active
  # noqa command-instead-of-module -- read-only status check; ansible.builtin.systemd
  # manages state (start/stop/restart) but cannot query current active status.
  # Equivalent using service_facts+assert is far more verbose for a smoke check.
  ansible.builtin.command:
    cmd: systemctl is-active tailscaled
  register: tailscaled_active
  changed_when: false
  failed_when: tailscaled_active.stdout | trim != 'active'
  tags: [tailscale, verify]

- name: Display Tailscale status summary
  ansible.builtin.command:
    cmd: tailscale status
  register: tailscale_status_display
  changed_when: false
  tags: [tailscale, verify]

- name: Print Tailscale status
  ansible.builtin.debug:
    msg: "{{ tailscale_status_display.stdout_lines }}"
  tags: [tailscale, verify]

- name: Operator reminder -- tailnet lock and route approval
  ansible.builtin.debug:
    msg: |
      ==========================================================================
      OPS-671 MANUAL STEP REQUIRED:
      If tailnet lock is enabled, the operator must approve this node in the
      Tailscale admin console and sign with the hardware tailnet lock key.
      Routes will not be active in the tailnet until approved.
      Admin URL: https://login.tailscale.com/admin/machines
      ==========================================================================
  tags: [tailscale, verify]
