---
# vault-secrets.yml — OPS-605
# Reads Authentik credentials from Vault (secret/authentik) and sets them
# as role-scoped facts for use in templates.
#
# Vault path layout (operator must seed before first apply):
#   secret/authentik.secret_key            — openssl rand -base64 60 | tr -d '\n'
#   secret/authentik.postgresql_password   — openssl rand -hex 32
#   secret/authentik.admin_email           — operator-decided email address
#   secret/authentik.admin_password        — openssl rand -base64 32 | tr -d /+= | head -c 24
#   secret/authentik.admin_token           — openssl rand -hex 32
#
# Usage — seed secrets before running playbook:
#   VAULT_ADDR=https://192.168.12.206:8200 VAULT_SKIP_VERIFY=true \
#   vault kv patch secret/authentik \
#     admin_password="$(openssl rand -base64 32 | tr -d /+= | head -c 24)" \
#     admin_token="$(openssl rand -hex 32)"

- name: Assert vault_token is available
  ansible.builtin.assert:
    that:
      - vault_token | default('') | length > 0
    fail_msg: >-
      vault_token is required. Pass via:
        -e vault_token=<scoped-vault-token>
      or inject via environment before running the playbook.

- name: Ensure hvac library is installed (required by community.hashi_vault.vault_kv2_get)
  ansible.builtin.apt:
    name: python3-hvac
    state: present
    cache_valid_time: 3600
  become: true

- name: Read Authentik secrets from Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: authentik
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    auth_method: token
    # Vault uses self-signed cert (internal CA); skip TLS verify for internal
    # Vault access — same pattern as VAULT_SKIP_VERIFY=true documented above.
    validate_certs: false
  register: authentik_vault_data
  no_log: true

- name: Set Authentik credential facts from Vault
  ansible.builtin.set_fact:
    authentik_secret_key: "{{ authentik_vault_data.secret.secret_key }}"
    authentik_db_password: "{{ authentik_vault_data.secret.postgresql_password }}"
    authentik_admin_email: "{{ authentik_vault_data.secret.admin_email }}"
    authentik_admin_password: "{{ authentik_vault_data.secret.admin_password }}"
    authentik_admin_token: "{{ authentik_vault_data.secret.admin_token }}"
  no_log: true

# ─── Phase 2: Keycloak federation secret ─────────────────────────────────────
# Reads client_id + client_secret for the "authentik-federation" Keycloak OIDC
# client created in realm "sentinel" (OPS-605 Phase 2).
# Vault path: secret/authentik/keycloak-upstream
# Seed with:
#   vault kv put secret/authentik/keycloak-upstream \
#     client_id="authentik-federation" \
#     client_secret="<generated-by-keycloak>"

- name: Read Keycloak federation secret from Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: authentik/keycloak-upstream
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    auth_method: token
    validate_certs: false
  register: authentik_federation_vault_data
  no_log: true

- name: Set Keycloak federation credential facts
  ansible.builtin.set_fact:
    authentik_keycloak_client_id: "{{ authentik_federation_vault_data.secret.client_id }}"
    authentik_keycloak_client_secret: "{{ authentik_federation_vault_data.secret.client_secret }}"
  no_log: true
