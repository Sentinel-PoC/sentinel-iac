---
# docker_install.yml — Phase 2: Install Docker CE inside home-assistant LXC
# OPS-585
#
# Uses pct exec to run commands inside the LXC from the PVE host.
# Docker CE from official apt repo; version >= 23.0.0 required by HA Container.
# Source: https://raw.githubusercontent.com/home-assistant/home-assistant.io/current/source/_includes/installation/container.md
#   "This guide will focus on installing it with Docker."
#   "you need Docker Engine 23.0.0 or later. Docker Desktop will not work"

# ── Check Docker ──────────────────────────────────────────────────────────────

- name: Check if Docker is already installed inside LXC
  ansible.builtin.command:
    cmd: "pct exec {{ ha_lxc_id }} -- docker --version"
  register: docker_installed
  failed_when: false
  changed_when: false
  tags: [ha-lxc, docker, install]

# ── Install Docker CE via official apt repo ───────────────────────────────────
# Following the Docker Engine install guide for Ubuntu:
# https://docs.docker.com/engine/install/ubuntu/

- name: Update apt cache inside LXC
  ansible.builtin.command:
    cmd: >
      pct exec {{ ha_lxc_id }} --
      apt-get update -qq
  when: docker_installed.rc != 0
  changed_when: true
  tags: [ha-lxc, docker, install]

- name: Install prerequisite packages inside LXC
  ansible.builtin.command:
    cmd: >
      pct exec {{ ha_lxc_id }} --
      apt-get install -y ca-certificates curl gnupg
  when: docker_installed.rc != 0
  changed_when: true
  tags: [ha-lxc, docker, install]

- name: Add Docker GPG key inside LXC
  ansible.builtin.command:
    cmd: >
      pct exec {{ ha_lxc_id }} -- bash -c
      "install -m 0755 -d /etc/apt/keyrings &&
       curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
       gpg --dearmor -o /etc/apt/keyrings/docker.gpg &&
       chmod a+r /etc/apt/keyrings/docker.gpg"
  when: docker_installed.rc != 0
  changed_when: true
  tags: [ha-lxc, docker, install]

- name: Add Docker apt repository inside LXC
  ansible.builtin.command:
    cmd: >
      pct exec {{ ha_lxc_id }} -- bash -c
      "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu noble stable'
      > /etc/apt/sources.list.d/docker.list"
  when: docker_installed.rc != 0
  changed_when: true
  tags: [ha-lxc, docker, install]

- name: Install Docker CE inside LXC
  ansible.builtin.command:
    cmd: >
      pct exec {{ ha_lxc_id }} -- bash -c
      "apt-get update -qq &&
       apt-get install -y
       docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
  when: docker_installed.rc != 0
  changed_when: true
  tags: [ha-lxc, docker, install]

# ── Enable Docker service ─────────────────────────────────────────────────────

- name: Enable Docker service inside LXC
  ansible.builtin.command:
    cmd: "pct exec {{ ha_lxc_id }} -- systemctl enable --now docker"
  changed_when: false
  tags: [ha-lxc, docker, service]

- name: Verify Docker is running inside LXC
  ansible.builtin.command:
    cmd: "pct exec {{ ha_lxc_id }} -- docker info"
  register: docker_info
  changed_when: false
  failed_when: docker_info.rc != 0
  tags: [ha-lxc, docker, verify]
