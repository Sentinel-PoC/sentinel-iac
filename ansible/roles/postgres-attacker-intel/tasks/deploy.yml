---
# [OPS-566] postgres-attacker-intel — Docker Compose deployment tasks

- name: Ensure compose directory exists (root-owned)
  ansible.builtin.file:
    path: "{{ attacker_db_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [attacker-db, deploy]

- name: Ensure data directory exists (UID 999 — postgres user inside container)
  ansible.builtin.file:
    path: "{{ attacker_db_data_dir }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0750"
  tags: [attacker-db, deploy]

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ attacker_db_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart attacker-intel-db
  tags: [attacker-db, deploy]

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: attacker-intel-db.service.j2
    dest: /etc/systemd/system/attacker-intel-db.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart attacker-intel-db
  tags: [attacker-db, deploy]

- name: Enable and start attacker-intel-db service
  ansible.builtin.systemd:
    name: attacker-intel-db
    enabled: true
    state: started
    daemon_reload: true
  tags: [attacker-db, deploy]

- name: Wait for PostgreSQL to be ready
  ansible.builtin.command:
    cmd: >
      docker exec {{ attacker_db_container_name }}
      pg_isready -U {{ attacker_db_superuser }} -d {{ attacker_db_name }}
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 15
  delay: 5
  changed_when: false
  tags: [attacker-db, deploy]
