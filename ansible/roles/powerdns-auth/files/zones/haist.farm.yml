        disabled: false

  # ---------------------------------------------------------------------------
  # SEC-88: S3 API FQDNs — direct host IPs (NOT Pangolin VIP).
  # Wildcard *.208.haist.farm routes to Pangolin (:168), which fronts only the
  # console (:9001).  These explicit records bypass the wildcard so that the
  # wildcard TLS cert (CN=*.208.haist.farm) resolves to the MinIO data-plane
  # hosts directly, enabling TLS termination without SNI mismatch.
  # ---------------------------------------------------------------------------
  - name: "s3.208.haist.farm."
    type: A
    ttl: 3600
    records:
      - content: "192.168.12.58"
        disabled: false

  - name: "s3-replica.208.haist.farm."
