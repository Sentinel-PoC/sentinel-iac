---
# OPS-675: haist.farm authoritative zone definition
# Source-of-truth for records applied via PowerDNS API (zone_apply.yml).
#
# Zone: haist.farm.  (single zone covering haist.farm + 208.haist.farm + subdomains)
# Primary: ns1.208.haist.farm (192.168.12.253)
# Secondary: ns2.208.haist.farm (192.168.12.254) — loaded via AXFR in Phase 6
#
# Format: rrsets in PowerDNS API format; zone_apply.yml adds changetype: REPLACE.
# To update: edit records below, bump SOA serial, re-run playbook --tags zone.
#
# Record sources (as of 2026-05-16):
#   STATIC   — operator-decided architecture (SOA, NS, wildcards, Pangolin routes)
#   NETBOX   — pulled from netbox.208.haist.farm (29 IPs, 20 with dns_name in .12.x)
#   PLATFORM — hosts in iac-control dnsmasq not yet in NetBox (child issue filed)
#
# gitlab.haist.farm intentionally omitted — GitLab (.68) decommissioned.
# gitlab.208.haist.farm included from NetBox (stale but harmless — host powered off).

zone: "haist.farm."

rrsets:

  # ---------------------------------------------------------------------------
  # SOA — serial YYYYMMDDNN (01 = first edit on 2026-05-16)
  # Refresh 3h, Retry 1h, Expire 7d, Minimum (negative cache TTL) 1h
  # Bump serial and re-run zone apply whenever records change.
  # ---------------------------------------------------------------------------
  - name: "haist.farm."
    type: SOA
    ttl: 3600
    records:
      - content: "ns1.208.haist.farm. hostmaster.haist.farm. 2026052901 10800 3600 604800 3600"
        disabled: false

  # ---------------------------------------------------------------------------
  # NS — zone apex nameservers
  # ---------------------------------------------------------------------------
  - name: "haist.farm."
    type: NS
    ttl: 3600
    records:
      - content: "ns1.208.haist.farm."
        disabled: false
      - content: "ns2.208.haist.farm."
        disabled: false

  # ---------------------------------------------------------------------------
  # STATIC: Nameserver self-records (ns1 + ns2 not in NetBox yet)
  # ---------------------------------------------------------------------------
  - name: "ns1.208.haist.farm."
    type: A
    ttl: 3600
    records:
      - content: "192.168.12.253"
        disabled: false

  - name: "ns2.208.haist.farm."
    type: A
    ttl: 3600
    records:
      - content: "192.168.12.254"
        disabled: false

  # ---------------------------------------------------------------------------
  # STATIC: Wildcards — Pangolin VIP (192.168.12.168)
  # Lower TTL (300s) intentional — wildcards may shift during active migration work
  # ---------------------------------------------------------------------------
  - name: "*.208.haist.farm."
    type: A
    ttl: 300
    records:
      - content: "192.168.12.168"
        disabled: false

  - name: "*.apps.overwatch.haist.farm."
    type: A
    ttl: 300
    records:
      - content: "192.168.12.168"
        disabled: false

  # ---------------------------------------------------------------------------
  # STATIC: Specific haist.farm records — SSO routes + IoT VLAN
  # (gitlab.haist.farm intentionally omitted — GitLab decommissioned)
  # ---------------------------------------------------------------------------
  - name: "auth.haist.farm."
    type: A
    ttl: 3600
    records:
      - content: "192.168.12.168"
        disabled: false

  - name: "matrix.haist.farm."
    type: A
    ttl: 3600
    records:
      - content: "192.168.12.168"
        disabled: false

  - name: "oauth2.haist.farm."
