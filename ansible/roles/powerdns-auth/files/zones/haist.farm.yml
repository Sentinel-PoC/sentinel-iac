  # Pangolin route removed OPS-974 (2026-05-26); OPS-1032 cancelled (LAN-only).
  # Without this record, jellyfin.208.haist.farm resolves to 192.168.12.168 (dead route).
  # .61 = pve4-alienware LXC 100 (jellyfin-lxc); confirmed by ha-lxc/defaults/main.yml.
  # ---------------------------------------------------------------------------
  - name: "jellyfin.208.haist.farm."
    type: A
    ttl: 3600
    records:
