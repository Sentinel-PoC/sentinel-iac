---
# vault-secrets.yml — OPS-818
# Reads oauth2-proxy credentials from Vault and sets them as role-scoped facts
# so env.oauth2-proxy.j2 is never deployed with empty secrets.
#
# Vault path layout (operator must seed before first apply):
#   secret/pangolin/oauth2-proxy.cookie_secret
#     — openssl rand -base64 32 | tr -d '\n' | head -c 32 | base64
#       (must be exactly 16, 24, or 32 bytes before base64-encoding)
#   secret/authentik/clients/pangolin.client_secret
#     — generated by Authentik when the OAuth2 provider is created;
#       copy from Authentik admin UI → Applications → pangolin → Provider
#
# Usage — pass vault_token when running the playbook:
#   ansible-playbook -i inventory/hosts.yml playbooks/pangolin-proxy.yml \
#     -e vault_token=<scoped-vault-token> \
#     -e vault_addr=https://192.168.12.206:8200

- name: Assert vault_token is available
  ansible.builtin.assert:
    that:
      - vault_token | default('') | length > 0
    fail_msg: >-
      vault_token is required. Pass via:
        -e vault_token=<scoped-vault-token>
      or inject via environment before running the playbook.
      Without this, the oauth2-proxy env file will contain empty secrets
      and the container will crash (exit 1) on startup.

- name: Ensure hvac library is installed (required by community.hashi_vault.vault_kv2_get)
  ansible.builtin.apt:
    name: python3-hvac
    state: present
    cache_valid_time: 3600
  become: true

- name: Read oauth2-proxy cookie secret from Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: pangolin/oauth2-proxy
    url: "{{ vault_addr | default('https://192.168.12.206:8200') }}"
    token: "{{ vault_token }}"
    auth_method: token
    validate_certs: false
  register: pangolin_oauth2_proxy_vault_data
  no_log: true

- name: Read oauth2-proxy client secret from Vault
  community.hashi_vault.vault_kv2_get:
    engine_mount_point: secret
    path: authentik/clients/pangolin
    url: "{{ vault_addr | default('https://192.168.12.206:8200') }}"
    token: "{{ vault_token }}"
    auth_method: token
    validate_certs: false
  register: pangolin_oauth2_client_vault_data
  no_log: true

- name: Set oauth2-proxy secret facts from Vault
  ansible.builtin.set_fact:
    pangolin_oauth2_cookie_secret: "{{ pangolin_oauth2_proxy_vault_data.secret.cookie_secret }}"
    pangolin_oauth2_client_secret: "{{ pangolin_oauth2_client_vault_data.secret.client_secret }}"
  no_log: true
