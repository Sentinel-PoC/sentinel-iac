# OPS-1125 Phase 2a -- jumbo storage VLAN 30
# Added 2026-06-01 by claude-sonnet-4-6 WORKER (sentinel-iac PR #537)
# ens3f0 pre-up raises parent MTU to 9216 before VLAN sub-interface comes up
# Deploy to: pve (192.168.12.6), /etc/network/interfaces.d/vlan30-storage.cfg

auto ens3f0.30
iface ens3f0.30 inet manual
	pre-up ip link set ens3f0 mtu 9216
	vlan-raw-device ens3f0
	mtu 9000

auto vmbr0v30
iface vmbr0v30 inet manual
	bridge-ports ens3f0.30
	bridge-stp off
	bridge-fd 0
	mtu 9000
