# OPS-1125 Phase 1 -- jumbo storage VLAN 30
# OPS-1127 -- corrected uplink NIC from eno1 to eno2
# Deploy to: pve3 (192.168.12.57), /etc/network/interfaces.d/vlan30-storage.cfg
#
# Root cause (OPS-1127): pve3 eno1 connects to UCG-Fiber port 6 (SFP+1), which
# does NOT L2-bridge VLAN 30 to its port 7 (USW Pro 48 DAC uplink). ARP replies
# from TrueNAS (on pve3) to master nodes (on pve2/USW) were silently dropped at
# UCG-Fiber ingress before reaching the USW.
#
# Fix: pve3 eno2 (b8:ca:3a:f5:04:bb) connects directly to USW Pro 48 port 50
# (SFP+ 2, jumbo enabled, tagged_vlan_mgmt:auto). Using eno2 for the storage
# bridge puts TrueNAS on the same switch fabric as master-1/2/3, eliminating
# the inter-switch VLAN forwarding gap.

auto eno2.30
iface eno2.30 inet manual
	pre-up ip link set eno2 up
	pre-up ip link set eno2 mtu 9000
	vlan-raw-device eno2
	mtu 9000

auto vmbr0v30
iface vmbr0v30 inet manual
	bridge-ports eno2.30
	bridge-stp off
	bridge-fd 0
	mtu 9000
