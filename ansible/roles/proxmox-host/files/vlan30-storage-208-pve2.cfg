# OPS-1125 Phase 2a -- jumbo storage VLAN 30
# Added 2026-06-01 by claude-sonnet-4-6 WORKER (sentinel-iac PR #537)
# eno1 pre-up raises parent MTU to 9216 before VLAN sub-interface comes up
# Deploy to: 208-pve2 (192.168.12.56), /etc/network/interfaces.d/vlan30-storage.cfg

auto eno1.30
iface eno1.30 inet manual
	pre-up ip link set eno1 mtu 9216
	vlan-raw-device eno1
	mtu 9000

auto vmbr0v30
iface vmbr0v30 inet manual
	bridge-ports eno1.30
	bridge-stp off
	bridge-fd 0
	mtu 9000
