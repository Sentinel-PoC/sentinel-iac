# Ansible managed — OPS-148 dual-home update (2026-04-28)
# mirror-registry split-horizon DNS for iac-control (serves OKD 10.0.0.x)
# OKD nodes use 10.0.0.1 as resolver — resolve mirror.208.haist.farm to OKD-side NIC
# Workstation uses UniFi DNS (192.168.12.1) — still resolves to 192.168.12.215 (unchanged)
address=/mirror.208.haist.farm/10.0.0.50
address=/mirror-registry-01.208.haist.farm/10.0.0.50

# DHCP reservation: pin 10.0.0.50 to mirror-registry NIC MAC — prevents DHCP pool conflict
# mirror-registry eth1 MAC: BC:24:11:F8:01:9C (VMID 215 net1, OPS-148)
dhcp-host=BC:24:11:F8:01:9C,mirror-registry,10.0.0.50,infinite
