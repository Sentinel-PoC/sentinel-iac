# --- Harbor mirror sweep with upstream Cosign verification (SEC-64) ---
# Runs daily at 03:00 UTC via harbor-sweep.timer.
# Deploys harbor-mirror-sweep.sh (wrapper) and calls mirror-upstream-image.sh
# for each entry in image-manifest.txt.
# The Cosign key env file (/etc/harbor-sweep/env) is NOT Ansible-managed —
# deploy it out-of-band with COSIGN_KEY_PATH and COSIGN_KEY_PASSWORD.

- name: Ensure /etc/harbor-sweep directory exists (cosign key env parent)
  ansible.builtin.file:
    path: /etc/harbor-sweep
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - platform-timers
    - harbor-sweep

- name: Deploy harbor-mirror-sweep script
  ansible.builtin.copy:
    src: harbor-mirror-sweep.sh
    dest: /usr/local/bin/harbor-mirror-sweep.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - platform-timers
    - harbor-sweep

# mirror-upstream-image.sh is called by harbor-mirror-sweep.sh for each image.
# It handles per-image Cosign verification against the trust policy.
# Deployed from scripts/ in the repo root (not files/ — it is not ansible-role-local).
- name: Deploy mirror-upstream-image script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/mirror-upstream-image.sh"
    dest: /usr/local/bin/mirror-upstream-image.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - platform-timers
    - harbor-sweep

# trust-policy.yaml defines which upstream registries and key fingerprints are
# trusted for Cosign verification. Operator manages the cosign key env file
# (/etc/harbor-sweep/env) out-of-band — do NOT deploy it from Ansible (it
# contains COSIGN_KEY_PASSWORD and must not live in git).
- name: Deploy supply-chain trust policy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../config/supply-chain/trust-policy.yaml"
    dest: /etc/harbor-sweep/trust-policy.yaml
    owner: root
    group: root
    mode: "0644"
  tags:
    - platform-timers
    - harbor-sweep

# image-manifest.txt lists source→target pairs the sweep iterates each run.
# Curated in scripts/ within the repo, deployed to /etc/harbor-sweep/ so the
# script finds it without needing a full sentinel-iac checkout on-host.
- name: Deploy image manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/image-manifest.txt"
    dest: /etc/harbor-sweep/image-manifest.txt
    owner: root
    group: root
    mode: "0644"
  tags:
    - platform-timers
    - harbor-sweep

- name: Deploy harbor-sweep systemd service
  ansible.builtin.copy:
    src: harbor-sweep.service
    dest: /etc/systemd/system/harbor-sweep.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - platform-timers
    - harbor-sweep

- name: Deploy harbor-sweep systemd timer
  ansible.builtin.copy:
    src: harbor-sweep.timer
    dest: /etc/systemd/system/harbor-sweep.timer
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - platform-timers
    - harbor-sweep

- name: Enable and start harbor-sweep timer
  ansible.builtin.systemd:
    name: harbor-sweep.timer
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - platform-timers
    - harbor-sweep

