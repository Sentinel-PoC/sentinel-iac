    enabled: true
    daemon_reload: true
  tags:
    - platform-timers
    - vault-autounseal-token-ttl

# --- IaC drift detection (daily 05:00 UTC) — OPS-193 ---
# Queries live config of Wazuh, Vault policies, Forgejo, etc. and compares
# against a declarative rules manifest. Catches the audit-drift class that
# motivated OPS-193: changes applied to live without IaC update OR vice versa.
#
# Required out-of-band file (NOT managed by this role; deploy once via
# ansible-vault or one-shot playbook):
#   /etc/iac-drift/env  (mode 0400 root:root)
#       — must contain `VAULT_TOKEN=<scoped-token>` for the iac-drift Vault
#         policy (read-only on the secret/data paths the rules.yaml references).
#         Same security model as /etc/vault-unseal/lookup-token.

- name: Ensure /etc/iac-drift directory exists
  ansible.builtin.file:
    path: /etc/iac-drift
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - platform-timers
    - iac-drift-check

- name: Assert iac-drift Vault token env file is present and protected
  ansible.builtin.stat:
    path: /etc/iac-drift/env
  register: iac_drift_env_stat
  tags:
    - platform-timers
    - iac-drift-check

- name: Fail if iac-drift env file is missing or mis-permed
  ansible.builtin.fail:
    msg: >-
      /etc/iac-drift/env must exist as 0400 root:root containing
      VAULT_TOKEN=<scoped-token>. The token policy must allow read on the
      Vault paths referenced in rules.yaml (secret/wazuh/api,
      secret/wazuh/indexer, sys/policies/acl/* read for vault-policy rules).
      See OPS-193 runbook (docs/runbooks/14-iac-drift-detection.md).
  when: >
    not iac_drift_env_stat.stat.exists
    or iac_drift_env_stat.stat.mode != '0400'
    or iac_drift_env_stat.stat.pw_name != 'root'
    or iac_drift_env_stat.stat.gr_name != 'root'
  tags:
    - platform-timers
    - iac-drift-check

- name: Ensure iac-drift rules deploy directory exists
