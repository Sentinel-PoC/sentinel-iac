# --- Vault Unseal Transit (every 2 minutes) ---
# Script was previously deployed manually with the unseal key embedded
# in plaintext (OPS-224). Now script is in files/, key is sourced at
# runtime from /etc/vault-unseal/transit.key (0400 root:root).
#
# The key file itself is NOT managed by this role — deploy it
# out-of-band (ansible vault-kv lookup is the proper long-term path;
# see OPS-224 follow-up TODO). The assertion below fails loudly if
# the key file is missing, so this never silently "succeeds" without
# the dependency in place.

- name: Ensure /etc/vault-unseal directory exists (key file parent)
  ansible.builtin.file:
    path: /etc/vault-unseal
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - platform-timers
    - vault-unseal-transit

- name: Assert Transit Vault unseal key file is present and protected
  ansible.builtin.stat:
    path: /etc/vault-unseal/transit.key
  register: transit_key_stat
  tags:
    - platform-timers
    - vault-unseal-transit

- name: Fail if Transit Vault unseal key file is missing or not root-only
  ansible.builtin.fail:
    msg: >-
      /etc/vault-unseal/transit.key must exist as 0400 root:root.
      Deploy it out-of-band before running this role. See OPS-224.
  when: >
    not transit_key_stat.stat.exists
    or transit_key_stat.stat.mode != '0400'
    or transit_key_stat.stat.pw_name != 'root'
    or transit_key_stat.stat.gr_name != 'root'
  tags:
    - platform-timers
    - vault-unseal-transit

- name: Deploy vault-unseal-transit script
  ansible.builtin.copy:
    src: vault-unseal-transit.sh
    dest: /usr/local/bin/vault-unseal-transit.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - platform-timers
    - vault-unseal-transit

- name: Deploy vault-unseal-transit systemd service
  ansible.builtin.copy:
    src: vault-unseal-transit.service
    dest: /etc/systemd/system/vault-unseal-transit.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - platform-timers
    - vault-unseal-transit

- name: Deploy vault-unseal-transit systemd timer
  ansible.builtin.copy:
    src: vault-unseal-transit.timer
    dest: /etc/systemd/system/vault-unseal-transit.timer
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - platform-timers
    - vault-unseal-transit

- name: Enable and start vault-unseal-transit timer
  ansible.builtin.systemd:
    name: vault-unseal-transit.timer
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - platform-timers
    - vault-unseal-transit

