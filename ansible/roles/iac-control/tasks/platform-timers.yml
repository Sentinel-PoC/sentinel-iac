# --- Vault auto-unseal token TTL monitor (daily) — OPS-190 / SEC-44 follow-up ---
# Asks Transit Vault for the prod-Vault auto-unseal token's remaining lease.
# WARN < 7d, CRIT < 24h. Designed to give the operator at least a week of
# warning before a SEC-44-class outage.
#
# Required out-of-band files (NOT managed by this role; deploy them once via
# ansible-vault or a one-shot playbook — same pattern as the transit unseal key):
#   /etc/vault-unseal/autounseal-accessor.token   (mode 0644 root:root)
#       — the accessor of the prod-Vault auto-unseal token.
#   /etc/vault-unseal/lookup-token                (mode 0400 root:root)
#       — a Transit Vault token bound to a tight policy that allows ONLY
#         `update` on auth/token/lookup-accessor.
#
# Asserts both files exist before installing the timer; refuses to "succeed"
# silently if the operator hasn't placed them.

- name: Assert auto-unseal accessor file is present
  ansible.builtin.stat:
    path: /etc/vault-unseal/autounseal-accessor.token
  register: autounseal_accessor_stat
  tags:
    - platform-timers
    - vault-autounseal-token-ttl

- name: Fail if auto-unseal accessor file is missing or mis-permed
  ansible.builtin.fail:
    msg: >-
      /etc/vault-unseal/autounseal-accessor.token must exist as 0644 root:root.
      Capture the accessor at SEC-44 recovery time (or via
      `vault list -format=json /auth/token/accessors` against the Transit Vault)
      and write it before re-running this role. See OPS-190.
  when: >
    not autounseal_accessor_stat.stat.exists
    or autounseal_accessor_stat.stat.mode != '0644'
    or autounseal_accessor_stat.stat.pw_name != 'root'
    or autounseal_accessor_stat.stat.gr_name != 'root'
  tags:
    - platform-timers
    - vault-autounseal-token-ttl

- name: Assert auto-unseal lookup-token file is present and protected
  ansible.builtin.stat:
    path: /etc/vault-unseal/lookup-token
  register: autounseal_lookup_stat
  tags:
    - platform-timers
    - vault-autounseal-token-ttl

- name: Fail if lookup-token file is missing or not root-only
  ansible.builtin.fail:
    msg: >-
      /etc/vault-unseal/lookup-token must exist as 0400 root:root and contain
      a Transit Vault token bound to a tight policy that allows ONLY
      `update` on auth/token/lookup-accessor. See OPS-190 for the policy.
  when: >
    not autounseal_lookup_stat.stat.exists
    or autounseal_lookup_stat.stat.mode != '0400'
    or autounseal_lookup_stat.stat.pw_name != 'root'
    or autounseal_lookup_stat.stat.gr_name != 'root'
  tags:
    - platform-timers
    - vault-autounseal-token-ttl

- name: Deploy vault-autounseal-token-ttl script
  ansible.builtin.copy:
    src: vault-autounseal-token-ttl.sh
    dest: /usr/local/bin/vault-autounseal-token-ttl.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - platform-timers
    - vault-autounseal-token-ttl

- name: Deploy vault-autounseal-token-ttl systemd service
  ansible.builtin.copy:
    src: vault-autounseal-token-ttl.service
    dest: /etc/systemd/system/vault-autounseal-token-ttl.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - platform-timers
    - vault-autounseal-token-ttl

- name: Deploy vault-autounseal-token-ttl systemd timer
  ansible.builtin.copy:
    src: vault-autounseal-token-ttl.timer
    dest: /etc/systemd/system/vault-autounseal-token-ttl.timer
