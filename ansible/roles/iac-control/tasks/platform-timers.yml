# --- Vault auto-unseal token rotation (weekly Sunday 03:00 UTC) — OPS-191 ---
# Rotates the periodic autounseal token embedded in /etc/vault/config/config.hcl
# on vault-server (192.168.12.206). Prevents the SEC-44-class outage from
# recurring if the token's periodic lease lapses (no-op TTL = expiry).
#
# Runs as ubuntu (needs ~/.ssh/id_sentinel + cert for SSH to vault-server).
# Mirrors the vault-tls-rotate pattern exactly.
#
# Required out-of-band file (NOT managed by this role; deploy once per runbook 15):
#   /etc/vault-unseal/rotation-token  (mode 0400 ubuntu:root)
#       An orphan periodic token on the Transit Vault, policy autounseal-rotate
#       (policies/vault/autounseal-rotate-policy.hcl).  Renewed on each weekly
#       rotation run; safe as long as the timer fires at least once per 30 days.

- name: Ensure /etc/vault-unseal directory exists (rotation-token parent)
  ansible.builtin.file:
    path: /etc/vault-unseal
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - platform-timers
    - vault-autounseal-rotate

- name: Assert vault-autounseal rotation-token file is present and protected
  ansible.builtin.stat:
    path: /etc/vault-unseal/rotation-token
  register: autounseal_rotation_stat
  tags:
    - platform-timers
    - vault-autounseal-rotate

- name: Fail if vault-autounseal rotation-token file is missing or mis-permed
  ansible.builtin.fail:
    msg: >-
      /etc/vault-unseal/rotation-token must exist as 0400, owner ubuntu (group root or ubuntu).
      Bootstrap it once per docs/runbooks/15-vault-autounseal-rotation.md before deploying
      this timer. The file holds an orphan periodic token (policy autounseal-rotate) on the
      Transit Vault; it is renewed on each weekly rotation run.
  when: >
    not autounseal_rotation_stat.stat.exists
    or autounseal_rotation_stat.stat.mode != '0400'
    or autounseal_rotation_stat.stat.pw_name != 'ubuntu'
  tags:
    - platform-timers
    - vault-autounseal-rotate

- name: Deploy vault-autounseal-rotate script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/vault-autounseal-rotate.sh"
    dest: /usr/local/bin/vault-autounseal-rotate.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - platform-timers
    - vault-autounseal-rotate

- name: Deploy vault-autounseal-rotate systemd service
  ansible.builtin.copy:
    src: vault-autounseal-rotate.service
    dest: /etc/systemd/system/vault-autounseal-rotate.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - platform-timers
    - vault-autounseal-rotate

- name: Deploy vault-autounseal-rotate systemd timer
  ansible.builtin.copy:
    src: vault-autounseal-rotate.timer
    dest: /etc/systemd/system/vault-autounseal-rotate.timer
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - platform-timers
    - vault-autounseal-rotate

- name: Enable and start vault-autounseal-rotate timer
  ansible.builtin.systemd:
    name: vault-autounseal-rotate.timer
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - platform-timers
    - vault-autounseal-rotate
