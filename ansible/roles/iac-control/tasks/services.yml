    - vault_minio_access_key == 'CHANGE_ME'
    - _vault_minio_ak_result is defined
    - _vault_minio_ak_result.rc | default(1) == 0
    - _vault_minio_ak_result.stdout | default('') | length > 0
  no_log: true
  tags:
    - services
    - compliance

- name: Fail if compliance MINIO_AK is still unset after Vault lookup
  ansible.builtin.fail:
    msg: >
      vault_minio_access_key is CHANGE_ME and Vault lookup failed.
      Set VAULT_TOKEN env var or pass -e vault_minio_access_key=<value>.
      Retrieve with: VAULT_ADDR=https://vault.208.haist.farm
      vault kv get -field=access_key secret/minio
  when:
    - vault_minio_access_key == 'CHANGE_ME'
  tags:
    - services
    - compliance

# [COMP-25] Fetch MinIO secret key from Vault.
# Vault path: secret/minio  field: secret_key
# Used by: compliance_minio_sk → MINIO_SK in compliance.env

- name: Fetch compliance MINIO_SK from Vault (requires VAULT_ADDR and VAULT_TOKEN in env)
  ansible.builtin.command:
    cmd: vault kv get -field=secret_key secret/minio
  environment:
    VAULT_ADDR: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.208.haist.farm', true) }}"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  register: _vault_minio_sk_result
  changed_when: false
  failed_when: false
  no_log: true
  when: vault_minio_secret_key == 'CHANGE_ME'
  delegate_to: localhost
  become: false
  tags:
    - services
    - compliance

- name: Set compliance MINIO_SK from Vault lookup result
  ansible.builtin.set_fact:
    vault_minio_secret_key: "{{ _vault_minio_sk_result.stdout | trim }}"
  when:
    - vault_minio_secret_key == 'CHANGE_ME'
    - _vault_minio_sk_result is defined
    - _vault_minio_sk_result.rc | default(1) == 0
    - _vault_minio_sk_result.stdout | default('') | length > 0
  no_log: true
  tags:
    - services
    - compliance

- name: Fail if compliance MINIO_SK is still unset after Vault lookup
  ansible.builtin.fail:
    msg: >
      vault_minio_secret_key is CHANGE_ME and Vault lookup failed.
      Set VAULT_TOKEN env var or pass -e vault_minio_secret_key=<value>.
      Retrieve with: VAULT_ADDR=https://vault.208.haist.farm
      vault kv get -field=secret_key secret/minio
  when:
    - vault_minio_secret_key == 'CHANGE_ME'
  tags:
    - services
    - compliance

- name: Deploy compliance environment file
  ansible.builtin.template:
    src: compliance.env.j2
    dest: /etc/sentinel/compliance.env
    owner: root
    group: root
    mode: "0600"
  tags:
    - services
    - compliance

