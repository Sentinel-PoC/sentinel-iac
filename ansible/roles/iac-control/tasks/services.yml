---
# iac-control role - additional services
# Binary tools, etcd backup, grafana alerts, qbit proxy, nginx PXE, Forgejo Runner

# --- Binary tools ---
# These are installed manually via scripts/binaries, not apt.
# We check if they exist and skip if present.
# Version pinning could be added later for reproducibility.

- name: Check which binary tools are installed
  ansible.builtin.command:
    cmd: "which {{ item.name }}"
  loop: "{{ binary_tools }}"
  register: binary_tool_checks
  changed_when: false
  failed_when: false
  tags:
    - services
    - binary-tools

- name: Display binary tool status
  ansible.builtin.debug:
    msg: "{{ item.item.name }}: {{ 'installed' if item.rc == 0 else 'MISSING - install manually' }}"
  loop: "{{ binary_tool_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - services
    - binary-tools

# --- GitLab Runner removal ---
# GitLab Runner was replaced by Forgejo Runner post-migration (OPS-216).
# These tasks remove the deployed binary, service, config directory, and
# cache-cleanup timer so they do not persist across future Ansible runs.

- name: Stop and disable gitlab-runner.service if present
  ansible.builtin.systemd:
    name: gitlab-runner
    state: stopped
    enabled: false
  failed_when: false
  tags:
    - services
    - gitlab-runner-removal

- name: Stop and disable gitlab-runner-cache-cleanup.timer if present
  ansible.builtin.systemd:
    name: gitlab-runner-cache-cleanup.timer
    state: stopped
    enabled: false
  failed_when: false
  tags:
    - services
    - gitlab-runner-removal

- name: Stop and disable gitlab-runner-cache-cleanup.service if present
  ansible.builtin.systemd:
    name: gitlab-runner-cache-cleanup
    state: stopped
    enabled: false
  failed_when: false
  tags:
    - services
    - gitlab-runner-removal

- name: Remove gitlab-runner binary
  ansible.builtin.file:
    path: /usr/local/bin/gitlab-runner
    state: absent
  tags:
    - services
    - gitlab-runner-removal

- name: Remove gitlab-runner systemd service unit
  ansible.builtin.file:
    path: /etc/systemd/system/gitlab-runner.service
    state: absent
  notify: Daemon-reload
  tags:
    - services
    - gitlab-runner-removal

- name: Remove gitlab-runner-cache-cleanup systemd service unit
  ansible.builtin.file:
    path: /etc/systemd/system/gitlab-runner-cache-cleanup.service
    state: absent
  notify: Daemon-reload
  tags:
    - services
    - gitlab-runner-removal

- name: Remove gitlab-runner-cache-cleanup systemd timer unit
  ansible.builtin.file:
    path: /etc/systemd/system/gitlab-runner-cache-cleanup.timer
    state: absent
  notify: Daemon-reload
  tags:
    - services
    - gitlab-runner-removal

- name: Remove /etc/gitlab-runner directory
  ansible.builtin.file:
    path: /etc/gitlab-runner
    state: absent
  tags:
    - services
    - gitlab-runner-removal

- name: Remove gitlab-runner-cache-cleanup script
  ansible.builtin.file:
    path: /usr/local/bin/gitlab-runner-cache-cleanup.sh
    state: absent
  tags:
    - services
    - gitlab-runner-removal

# --- etcd backup ---

# OPS-285: Fetch scoped MinIO credentials for etcd-backup from Vault.
# Vault path: secret/minio/etcd-backup (access_key: etcd-backup-prod, bucket-only policy)
# These vars are used by etcd-backup.env.j2 and are NOT written to disk directly.
- name: Fetch etcd-backup MinIO access key from Vault (OPS-285)
  ansible.builtin.command:
    cmd: >
      vault kv get -address=https://vault.208.haist.farm
      -field=access_key secret/minio/etcd-backup
  register: vault_etcd_backup_minio_ak_raw
  changed_when: false
  no_log: true
  environment:
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  tags:
    - services
    - etcd-backup

- name: Fetch etcd-backup MinIO secret key from Vault (OPS-285)
  ansible.builtin.command:
    cmd: >
      vault kv get -address=https://vault.208.haist.farm
      -field=secret_key secret/minio/etcd-backup
  register: vault_etcd_backup_minio_sk_raw
  changed_when: false
  no_log: true
  environment:
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  tags:
    - services
    - etcd-backup

- name: Set etcd-backup MinIO credential facts (OPS-285)
  ansible.builtin.set_fact:
    vault_etcd_backup_minio_ak: "{{ vault_etcd_backup_minio_ak_raw.stdout }}"
    vault_etcd_backup_minio_sk: "{{ vault_etcd_backup_minio_sk_raw.stdout }}"
  no_log: true
  tags:
    - services
    - etcd-backup

- name: Ensure /etc/sentinel directory exists
  ansible.builtin.file:
    path: /etc/sentinel
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - services
    - etcd-backup

- name: Deploy etcd-backup env file with scoped MinIO creds (OPS-285)
  ansible.builtin.template:
    src: etcd-backup.env.j2
    dest: /etc/sentinel/etcd-backup.env
    owner: root
    group: ubuntu
    mode: "0640"
  no_log: true
  notify: Restart etcd-backup-timer
  tags:
    - services
    - etcd-backup

- name: Deploy etcd backup script
  ansible.builtin.template:
    src: etcd-backup.sh.j2
    dest: /usr/local/bin/etcd-backup.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - services
    - etcd-backup

- name: Deploy etcd backup systemd service
  ansible.builtin.template:
    src: etcd-backup.service.j2
    dest: /etc/systemd/system/etcd-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - services
    - etcd-backup

- name: Deploy etcd backup systemd timer
  ansible.builtin.template:
    src: etcd-backup.timer.j2
    dest: /etc/systemd/system/etcd-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon-reload
    - Restart etcd-backup-timer
  tags:
    - services
    - etcd-backup

- name: Enable and start etcd backup timer
  ansible.builtin.systemd:
    name: etcd-backup.timer
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - services
    - etcd-backup

