# --- Sentinel Prometheus ---
# Standalone Prometheus instance for scraping UniFi, Traefik, Vault, Wazuh metrics.
# Grafana in OKD uses this as a secondary datasource (http://192.168.12.210:9099).

- name: Download Prometheus {{ prometheus_version }}
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp/prometheus-{{ prometheus_version }}.tar.gz
    mode: "0644"
  tags:
    - services
    - prometheus

- name: Extract Prometheus binary
  ansible.builtin.unarchive:
    src: /tmp/prometheus-{{ prometheus_version }}.tar.gz
    dest: /tmp/
    remote_src: true
    creates: /tmp/prometheus-{{ prometheus_version }}.linux-amd64/prometheus
  tags:
    - services
    - prometheus

- name: Install Prometheus binary
  ansible.builtin.copy:
    src: /tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify:
    - Restart sentinel-prometheus
  tags:
    - services
    - prometheus

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: "0755"
  loop:
    - /etc/prometheus
    - /opt/prometheus-unifi
    - "{{ prometheus_data_dir }}"
  tags:
    - services
    - prometheus

- name: Deploy Prometheus config
  ansible.builtin.template:
    src: sentinel-prometheus.yml.j2
    dest: /opt/prometheus-unifi/prometheus.yml
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify:
    - Restart sentinel-prometheus
  tags:
    - services
    - prometheus

- name: Create Prometheus config symlink
  ansible.builtin.file:
    src: /opt/prometheus-unifi/prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    state: link
    force: true
  tags:
    - services
    - prometheus

- name: Deploy sentinel-prometheus.service
  ansible.builtin.template:
    src: sentinel-prometheus.service.j2
    dest: /etc/systemd/system/sentinel-prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon-reload
    - Restart sentinel-prometheus
  tags:
    - services
    - prometheus

- name: Enable and start sentinel-prometheus
  ansible.builtin.systemd:
    name: sentinel-prometheus
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - services
    - prometheus

- name: Clean up Prometheus tarball
  ansible.builtin.file:
    path: /tmp/prometheus-{{ prometheus_version }}.tar.gz
    state: absent
  tags:
    - services
    - prometheus

# --- UniFi monitoring stack (collector + exporter) ---
# Collector runs every 5 minutes via systemd timer, writes JSON snapshot.
# Exporter is a long-running HTTP server exposing Prometheus metrics at :9120.

- name: Clone sentinel-unifi repository
  ansible.builtin.git:
    repo: "{{ unifi_gitlab_repo }}"
    dest: "{{ unifi_repo_dir }}"
    version: main
    update: true
    force: true  # OPS-244: reset local drift; IaC state is authoritative
  become: true
  become_user: ubuntu
  tags:
    - services
    - unifi

- name: Create UniFi collector log directory
  ansible.builtin.file:
    path: /var/log/sentinel/unifi
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  tags:
    - services
    - unifi

# --- [OPS-169] vault-agent AppRole credential for unifi-collector ---
# Replaces the OPS-167 static 32-day periodic token with AppRole auto-auth.
# vault-agent-unifi-collector.service authenticates via AppRole and writes a
# short-lived renewable token to /run/sentinel-unifi/.vault-token.
# unifi-collector.service reads VAULT_TOKEN from that path at each invocation.
#
# AppRole provisioning + vault-agent deploy are handled by the included task file.
# The static vault-token.env file is now reduced to VAULT_ADDR + VAULT_SKIP_VERIFY only.

- name: Create /etc/sentinel-unifi config directory
  ansible.builtin.file:
    path: /etc/sentinel-unifi
    state: directory
    owner: root
    group: ubuntu
    mode: "0750"
  tags:
    - services
    - unifi

- name: Deploy unifi-collector Vault address env file (VAULT_ADDR + VAULT_SKIP_VERIFY only)
  # [OPS-169] VAULT_TOKEN removed — now provided at runtime by vault-agent token sink.
  ansible.builtin.template:
    src: unifi-vault-token.env.j2
    dest: /etc/sentinel-unifi/vault-token.env
    owner: root
    group: ubuntu
    mode: "0640"
  notify: Daemon-reload
  tags:
    - services
    - unifi

- name: Include unifi-collector AppRole provisioning and vault-agent deploy (OPS-169)
  ansible.builtin.include_tasks: unifi-collector-approle.yml
  tags:
    - services
    - unifi
    - unifi-approle

- name: Deploy unifi-exporter.service
  ansible.builtin.template:
    src: unifi-exporter.service.j2
    dest: /etc/systemd/system/unifi-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon-reload
    - Restart unifi-exporter
  tags:
    - services
    - unifi

- name: Deploy unifi-collector.service
  ansible.builtin.template:
    src: unifi-collector.service.j2
    dest: /etc/systemd/system/unifi-collector.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - services
    - unifi

- name: Deploy unifi-collector.timer
  ansible.builtin.template:
    src: unifi-collector.timer.j2
    dest: /etc/systemd/system/unifi-collector.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon-reload
    - Restart unifi-collector-timer
  tags:
    - services
    - unifi

# [OPS-167] Remove pre-Vault plaintext credential file.
# /etc/sentinel/unifi.env (born 2026-02-10) stored UNIFI_API_KEY in plaintext under the
# old from_env() approach. It is NOT referenced by any systemd unit, crontab, or running
# process as of OPS-167 audit (2026-04-28). The key is preserved in Vault at secret/data/unifi.
# Gate 10 acceptance criterion: `grep -rE "YrF1" /etc /home/ubuntu/sentinel-unifi` must return empty.
- name: Remove pre-Vault plaintext UniFi credential file (OPS-167 gate 10 cleanup)
  ansible.builtin.file:
    path: /etc/sentinel/unifi.env
    state: absent
  tags:
    - services
    - unifi

- name: Enable and start unifi-exporter
  ansible.builtin.systemd:
    name: unifi-exporter
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - services
    - unifi

- name: Enable and start unifi-collector timer
  ansible.builtin.systemd:
    name: unifi-collector.timer
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - services
    - unifi

