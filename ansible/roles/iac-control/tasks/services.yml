# --- Wazuh agent tuning ---

- name: Deploy Wazuh agent local_internal_options to increase event buffer
  ansible.builtin.copy:
    content: |
      # Increased buffer to prevent event queue overflow (L9 alerts during compliance runs)
      agent.buffer_size=20000
      agent.events_per_second=1000
    dest: /var/ossec/etc/local_internal_options.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: Restart wazuh-agent
  tags:
    - services
    - wazuh

# --- mirror-registry dnsmasq split-horizon + DHCP reservation — OPS-148 (2026-04-28) ---
# Resolves mirror.208.haist.farm to 10.0.0.50 (OKD NIC) for cluster-internal clients.
# Workstation/mgmt resolution via UniFi stays at 192.168.12.215.
# Also pins 10.0.0.50 to mirror-registry MAC to prevent DHCP pool conflict.

- name: Deploy mirror-registry dnsmasq override (split-horizon + DHCP reservation)
  ansible.builtin.copy:
