# --- Nginx PXE server ---

- name: Create Nginx PXE directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ nginx_pxe_dirs }}"
  tags:
    - services
    - nginx
    - pxe

- name: Set ignition directory writable by forgejo-runner (CI pipeline writes here)
  ansible.builtin.file:
    path: /var/www/html/ignition
    state: directory
    owner: forgejo-runner
    group: www-data
    mode: "0775"
  failed_when: false
  tags:
    - services
    - nginx
    - pxe

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx
  tags:
    - services
    - nginx
    - pxe

- name: Deploy Nginx PXE config to conf.d
  ansible.builtin.template:
    src: nginx-pxe.conf.j2
    dest: /etc/nginx/conf.d/pxe.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx
  tags:
    - services
    - nginx
    - pxe

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  tags:
    - services
    - nginx

# --- Proxmox snapshot automation ---
# Token secret stored in Vault at secret/proxmox (field: api_token_secret).
# Retrieve with: vault kv get -field=api_token_secret secret/proxmox
# Pass at run time via: ansible-playbook ... -e vault_proxmox_snapshot_token_secret=<value>
# OR use the automatic Vault fetch task below (requires VAULT_ADDR + VAULT_TOKEN env vars
# set in the CI environment, or run the vault-env.sh helper first).

- name: Fetch Proxmox API token secret from Vault (requires VAULT_ADDR and VAULT_TOKEN in env)
  ansible.builtin.command:
    cmd: vault kv get -field=api_token_secret secret/proxmox
  environment:
    VAULT_ADDR: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.208.haist.farm', true) }}"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  register: _vault_proxmox_token_result
  changed_when: false
  failed_when: false
  no_log: true
  when: vault_proxmox_snapshot_token_secret == 'CHANGE_ME'
  delegate_to: localhost
  become: false
  tags:
    - services
    - proxmox-snapshot

- name: Set Proxmox API token secret from Vault lookup result
  ansible.builtin.set_fact:
    vault_proxmox_snapshot_token_secret: "{{ _vault_proxmox_token_result.stdout | trim }}"
  when:
    - vault_proxmox_snapshot_token_secret == 'CHANGE_ME'
    - _vault_proxmox_token_result is defined
    - _vault_proxmox_token_result.rc | default(1) == 0
    - _vault_proxmox_token_result.stdout | default('') | length > 0
  no_log: true
  tags:
    - services
    - proxmox-snapshot

- name: Fail if Proxmox API token secret is still unset after Vault lookup
  ansible.builtin.fail:
    msg: >
      vault_proxmox_snapshot_token_secret is CHANGE_ME and Vault lookup failed.
      Set VAULT_TOKEN env var or pass -e vault_proxmox_snapshot_token_secret=<value>.
      Retrieve with: VAULT_ADDR=https://vault.208.haist.farm
      vault kv get -field=api_token_secret secret/proxmox
  when:
    - vault_proxmox_snapshot_token_secret == 'CHANGE_ME'
  tags:
    - services
    - proxmox-snapshot

- name: Deploy Proxmox snapshot script
  ansible.builtin.template:
    src: proxmox-snapshot.sh.j2
    dest: /usr/local/bin/proxmox-snapshot.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - services
    - proxmox-snapshot

- name: Deploy Proxmox snapshot systemd service
  ansible.builtin.template:
    src: proxmox-snapshot.service.j2
    dest: /etc/systemd/system/proxmox-snapshot.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - services
    - proxmox-snapshot

- name: Deploy Proxmox snapshot systemd timer
  ansible.builtin.template:
    src: proxmox-snapshot.timer.j2
    dest: /etc/systemd/system/proxmox-snapshot.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon-reload
    - Restart proxmox-snapshot-timer
  tags:
    - services
    - proxmox-snapshot

- name: Enable and start Proxmox snapshot timer
  ansible.builtin.systemd:
    name: proxmox-snapshot.timer
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - services
    - proxmox-snapshot

