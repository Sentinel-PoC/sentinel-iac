# --- Compliance environment ---
# VAULT_TOKEN for compliance.env is fetched from Vault at run time.
# Requires: VAULT_ADDR + VAULT_TOKEN set in CI env (or run vault-env.sh first).
# Vault path: secret/compliance  field: vault_token
# Create with: vault kv put secret/compliance vault_token=<periodic-token>
# Token policy must allow: read secret/data/defectdojo and other paths the
# compliance check script reads. Minimum TTL 30d; renewable.
# See also: ansible/roles/iac-control/tasks/services.yml proxmox-snapshot block
# for the same pattern.

- name: Create sentinel config directory
  ansible.builtin.file:
    path: /etc/sentinel
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - services
    - compliance

# OPS-737: nist-compliance-check.service runs as User=ubuntu and writes daily JSON
# reports to /var/log/sentinel/. The directory must be ubuntu-owned so the service
# can create new date-stamped files. /etc/sentinel/compliance.env stays root:root 0600;
# systemd reads EnvironmentFile= as root before privilege drop — no mode change needed there.
- name: Create sentinel compliance log directory (ubuntu-writable for daily JSON reports)
  ansible.builtin.file:
    path: /var/log/sentinel
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  tags:
    - services
    - compliance

- name: Fetch compliance VAULT_TOKEN from Vault (requires VAULT_ADDR and VAULT_TOKEN in env)
  ansible.builtin.command:
    cmd: vault kv get -field=vault_token secret/compliance
  environment:
    VAULT_ADDR: "{{ lookup('env', 'VAULT_ADDR') | default('https://vault.208.haist.farm', true) }}"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
  register: _vault_compliance_token_result
  changed_when: false
  failed_when: false
  no_log: true
  when: vault_compliance_token == 'CHANGE_ME'
  delegate_to: localhost
  become: false
  tags:
    - services
    - compliance

- name: Set compliance VAULT_TOKEN from Vault lookup result
  ansible.builtin.set_fact:
    vault_compliance_token: "{{ _vault_compliance_token_result.stdout | trim }}"
  when:
    - vault_compliance_token == 'CHANGE_ME'
    - _vault_compliance_token_result is defined
    - _vault_compliance_token_result.rc | default(1) == 0
    - _vault_compliance_token_result.stdout | default('') | length > 0
  no_log: true
  tags:
    - services
    - compliance

- name: Fail if compliance VAULT_TOKEN is still unset after Vault lookup
  ansible.builtin.fail:
    msg: >
      vault_compliance_token is CHANGE_ME and Vault lookup failed.
      Set VAULT_TOKEN env var or pass -e vault_compliance_token=<value>.
      Retrieve with: VAULT_ADDR=https://vault.208.haist.farm
      vault kv get -field=vault_token secret/compliance
  when:
    - vault_compliance_token == 'CHANGE_ME'
  tags:
    - services
    - compliance

