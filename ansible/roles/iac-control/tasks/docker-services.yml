---
# iac-control role - Docker container services
# Codifies 4 Docker containers running on iac-control:
#   - vault-unseal: Transit Vault for auto-unseal (hashicorp/vault:1.21.2, port 8201->8200)
#   - loki: Log aggregation (grafana/loki:2.9.3, port 3100)
#   - promtail: Log shipper to Loki (grafana/promtail:2.9.3)
#   - spire-server: SPIRE Server for workload identity (ghcr.io/spiffe/spire-server, OPS-352)

# --- Vault Unseal (Transit Vault) ---
# Runs as a standalone Docker container, not via docker-compose.
# Provides auto-unseal for the main Vault instance.

# --- SEC-89: Phase A — pre-stage transit Vault TLS cert (non-disruptive) ---
# Generate a self-signed TLS cert for the transit Vault listener.
# MUST run before the vault-unseal container task.
# Circular-trust rationale: this cert is statically generated by Ansible (no
# Vault PKI dependency), mirroring how prod Vault's TLS cert at /etc/vault/tls
# was set up out-of-band (OPS-541). The transit Vault is at the BOTTOM of the
# unseal chain, so its cert cannot come from any Vault-issued CA.
# Idempotent: only regenerates if cert is missing or within 30 days of expiry.

- name: SEC-89 Create vault-unseal TLS directory
  ansible.builtin.file:
    path: "{{ vault_unseal_tls_dir }}"
    state: directory
    owner: "{{ vault_unseal_uid }}"
    group: "{{ vault_unseal_gid }}"
    mode: "0750"
  tags:
    - docker-services
    - vault-unseal
    - vault-unseal-tls

- name: SEC-89 Generate vault-unseal TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ vault_unseal_tls_key }}"
    type: RSA
    size: 4096
    owner: "{{ vault_unseal_uid }}"
    group: "{{ vault_unseal_gid }}"
    mode: "0640"
  tags:
    - docker-services
    - vault-unseal
    - vault-unseal-tls

- name: SEC-89 Generate vault-unseal TLS CSR
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ vault_unseal_tls_key }}"
    common_name: "vault-unseal.iac-control.haist.farm"
    subject_alt_name:
      - "IP:192.168.12.210"
      - "IP:127.0.0.1"
      - "DNS:localhost"
    use_common_name_for_san: false
  register: vault_unseal_tls_csr
  changed_when: false
  tags:
    - docker-services
    - vault-unseal
    - vault-unseal-tls

- name: SEC-89 Issue self-signed vault-unseal TLS certificate (3650d)
  community.crypto.x509_certificate:
    path: "{{ vault_unseal_tls_cert }}"
    privatekey_path: "{{ vault_unseal_tls_key }}"
    csr_content: "{{ vault_unseal_tls_csr.csr }}"
    provider: selfsigned
    selfsigned_not_after: "+3650d"
    owner: "{{ vault_unseal_uid }}"
    group: "{{ vault_unseal_gid }}"
    mode: "0644"
  tags:
    - docker-services
    - vault-unseal
    - vault-unseal-tls

- name: SEC-89 Distribute transit Vault CA cert to prod Vault host trust path
  # Copies the self-signed cert to the prod Vault host so it can validate the
  # transit listener TLS connection in the seal "transit" stanza (tls_ca_cert).
  # Destination: /etc/vault/tls/transit-ca.pem on vault-server (192.168.12.206).
  ansible.builtin.copy:
    src: "{{ vault_unseal_tls_cert }}"
    dest: "/etc/vault/tls/transit-ca.pem"
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ groups['vault-server'][0] }}"
  tags:
    - docker-services
    - vault-unseal
    - vault-unseal-tls

# --- End SEC-89 Phase A ---

- name: Create vault-unseal config directory
  ansible.builtin.file:
    path: "{{ vault_unseal_config_dir }}"
    state: directory
    owner: "{{ vault_unseal_uid }}"
    group: "{{ vault_unseal_gid }}"
    mode: "{{ vault_unseal_dir_mode }}"
  tags:
    - docker-services
    - vault-unseal

- name: Create vault-unseal data directory
  ansible.builtin.file:
    path: "{{ vault_unseal_data_dir }}"
    state: directory
    owner: "{{ vault_unseal_uid }}"
    group: "{{ vault_unseal_gid }}"
    mode: "{{ vault_unseal_dir_mode }}"
  tags:
    - docker-services
    - vault-unseal

- name: Deploy vault-unseal Vault config
  ansible.builtin.template:
    src: vault-unseal-config.hcl.j2
    dest: "{{ vault_unseal_config_dir }}/vault.hcl"
    owner: "{{ vault_unseal_uid }}"
    group: "{{ vault_unseal_gid }}"
    mode: "0640"
  tags:
    - docker-services
    - vault-unseal

- name: Ensure vault-unseal container is running
  community.docker.docker_container:
    name: vault-unseal
    image: "hashicorp/vault:{{ vault_unseal_image_version }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ vault_unseal_host }}:{{ vault_unseal_port }}:8200"
    volumes:
      - "{{ vault_unseal_data_dir }}:/vault/data"
      - "{{ vault_unseal_config_dir }}:/vault/config"
    command: server
  tags:
    - docker-services
    - vault-unseal

- name: OPS-261 Verify vault-unseal service is healthy post-deploy
  # SEC-89: url flipped to https://; ca_path set to the self-signed cert
  # deployed in Phase A. validate_certs: true so TLS is actually verified.
  ansible.builtin.uri:
    url: "https://{{ vault_unseal_host | default('192.168.12.210') }}:{{ vault_unseal_port | default(8201) }}/v1/sys/health"
    status_code: [200, 429, 472, 473, 501, 503]
    timeout: 5
    validate_certs: true
    ca_path: "{{ vault_unseal_tls_cert }}"
  register: vault_unseal_health
  retries: 3
  delay: 5
  until: vault_unseal_health is succeeded
  failed_when:
    - vault_unseal_health.status not in [200, 429, 472, 473, 501, 503]
  changed_when: false
  tags:
    - docker-services
    - vault-unseal

# --- Loki + Promtail (log stack via docker-compose) ---
# Runs via docker-compose in /home/ubuntu/loki-stack on iac-control.
# Loki receives logs from Promtail and exposes port 3100 for Grafana queries.

- name: Create loki-stack directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ loki_stack_dir }}"
    - "{{ loki_stack_dir }}/loki"
    - "{{ loki_stack_dir }}/promtail"
  tags:
    - docker-services
    - loki

- name: Deploy loki-stack docker-compose file
  ansible.builtin.template:
    src: loki-stack-compose.yml.j2
    dest: "{{ loki_stack_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  tags:
    - docker-services
    - loki

- name: Deploy Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ loki_stack_dir }}/loki/loki-config.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  tags:
    - docker-services
    - loki

- name: Deploy Promtail configuration
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ loki_stack_dir }}/promtail/promtail-config.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  tags:
    - docker-services
    - loki

- name: Start loki-stack via docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ loki_stack_dir }}"
    state: present
    pull: missing
  tags:
    - docker-services
    - loki

# --- SPIRE Server (OPS-352) ---
# Trust domain: agents.haist.farm
# Upstream authority: Vault spire-pki/ intermediate CA (signed by isolated spire-root/)
# gRPC: host {{ spire_server_lan_ip }}:{{ spire_server_host_port }} → container :{{ spire_server_grpc_port }}
# Health: 127.0.0.1:{{ spire_server_health_host_port }} → container :{{ spire_server_health_port }} (local only)
#
# PRE-REQUISITE: vault-server role's spire-pki.yml must have run first to provision:
#   - spire-root/ self-signed root CA (isolated from production Vault PKI)
#   - spire-pki/ intermediate CA (signed by spire-root/, NOT pki_int/)
#   - Vault policy + AppRole credentials stored at secret/spire-server/approle-credentials

- name: Create SPIRE Server config directory
  ansible.builtin.file:
    path: "{{ spire_server_config_dir }}"
    state: directory
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    mode: "{{ spire_server_secret_dir_mode }}"
  tags:
    - docker-services
    - spire-server

- name: Create SPIRE Server data directory
  ansible.builtin.file:
    path: "{{ spire_server_data_dir }}"
    state: directory
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    mode: "{{ spire_server_dir_mode }}"
  tags:
    - docker-services
    - spire-server

- name: Fetch SPIRE AppRole credentials from Vault KV
  # Requires VAULT_TOKEN in the ansible-playbook environment (same as compliance/proxmox tasks)
  # Vault path: secret/spire-server/approle-credentials  fields: role_id, secret_id
  # Provisioned by vault-server role's spire-pki.yml (--tags spire-pki)
  ansible.builtin.uri:
    url: "https://vault.208.haist.farm/v1/secret/data/spire-server/approle-credentials"
    method: GET
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    validate_certs: true
    status_code: 200
    return_content: true
  register: spire_approle_creds_response
  changed_when: false
  failed_when: spire_approle_creds_response.status != 200
  no_log: true
  tags:
    - docker-services
    - spire-server

- name: Set SPIRE AppRole credential facts for template rendering
  ansible.builtin.set_fact:
    spire_vault_approle_id: "{{ spire_approle_creds_response.json.data.data.role_id }}"
    spire_vault_approle_secret_id: "{{ spire_approle_creds_response.json.data.data.secret_id }}"
  no_log: true
  tags:
    - docker-services
    - spire-server

- name: Deploy SPIRE Server configuration
  ansible.builtin.template:
    src: spire-server.conf.j2
    dest: "{{ spire_server_config_dir }}/server.conf"
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    mode: "0600"
  no_log: true
  notify: Restart spire-server
  tags:
    - docker-services
    - spire-server

- name: Verify SPIRE Server image signature (supply-chain hygiene)
  ansible.builtin.command:
    cmd: >
      cosign verify
      --certificate-identity-regexp "^https://github.com/spiffe/spire/"
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      {{ spire_server_image }}:{{ spire_server_image_version }}
  register: spire_cosign_verify
  changed_when: false
  failed_when: spire_cosign_verify.rc != 0
  tags:
    - docker-services
    - spire-server
    - supply-chain

- name: Create shared spire-server API socket directory on host
  # OPS-537 / OPS-351 Phase 4.4a — the spire-oidc-discovery-provider sidecar
  # reads spire-server's local gRPC API socket via this shared bind-mount.
  # spire-server creates api.sock here on startup (its built-in default
  # socket_path, /tmp/spire-server/private/api.sock — verified upstream at
  # conf/server/server_full.conf v1.14.6). Owned by spire_server_uid so the
  # spire-server process can create the socket; provider runs as the same UID.
  ansible.builtin.file:
    path: "{{ spire_server_admin_socket_host_dir }}"
    state: directory
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    mode: "0700"
  tags:
    - docker-services
    - spire-server

# OPS-358 — Recursive chown of all SPIRE Server host directories to the non-root
# UID/GID before the container starts. Required because:
#   - spire_server_data_dir contains keys.json (disk KeyManager signing keys) and
#     datastore.sqlite3 created by a previous root-UID container run. SPIRE cannot
#     start if it cannot read/write those files.
#   - spire_server_config_dir contains server.conf (Ansible-managed, but chown
#     makes the whole tree consistent and prevents leftover root-owned fragments
#     from a partial previous apply).
#   - spire_server_admin_socket_host_dir must be writable by the process so it can
#     create api.sock; the directory create task above handles new deployments, but
#     recurse:true here is a no-op on an empty dir and harmless.
# ansible.builtin.file with recurse:true is idempotent — subsequent applies that
# find ownership already correct produce no change.
- name: OPS-358 Chown SPIRE Server data directory to non-root UID
  # mode is intentionally omitted here: recurse:true with a mode would force
  # every file under the directory (keys.json, datastore.sqlite3) to that mode,
  # making SPIRE's signing keys world-readable. We only fix ownership; SPIRE
  # itself manages restrictive file modes (0600) on its key material.
  ansible.builtin.file:
    path: "{{ spire_server_data_dir }}"
    state: directory
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    recurse: true
  tags:
    - docker-services
    - spire-server

- name: OPS-358 Chown SPIRE Server config directory to non-root UID
  ansible.builtin.file:
    path: "{{ spire_server_config_dir }}"
    state: directory
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    mode: "{{ spire_server_secret_dir_mode }}"
    recurse: true
  tags:
    - docker-services
    - spire-server

- name: OPS-358 Chown SPIRE Server API socket directory to non-root UID
  ansible.builtin.file:
    path: "{{ spire_server_admin_socket_host_dir }}"
    state: directory
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    mode: "0700"
    recurse: true
  tags:
    - docker-services
    - spire-server

# --- SPIRE Server — x509pop trusted CA bundle provisioning (OPS-553) ---
# ORDERING: these tasks MUST run before "Ensure SPIRE Server container is running"
# so that trusted-node-cas.pem exists on disk when the container starts with the
# x509pop NodeAttestor config. The x509pop plugin fails fatally on startup if the
# ca_bundle_path is missing — it does not defer the load.
# Moved here from after the health check (fix for task-ordering bug found during
# 2026-06-03 apply: server crash-looped because CA bundle was written after container start).

- name: OPS-553 Fetch spire-pki/ CA chain from Vault (x509pop trusted CA bundle)
  ansible.builtin.uri:
    url: "https://vault.208.haist.farm/v1/spire-pki/ca/pem"
    method: GET
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    validate_certs: true
    status_code: 200
    return_content: true
  register: spire_pki_ca_pem
  changed_when: false
  tags:
    - docker-services
    - spire-server
    - spire-node-certs

- name: OPS-553 Write x509pop trusted CA bundle to SPIRE Server config dir
  ansible.builtin.copy:
    dest: "{{ spire_server_trusted_ca_bundle }}"
    content: "{{ spire_pki_ca_pem.content }}"
    owner: "{{ spire_server_uid }}"
    group: "{{ spire_server_gid }}"
    mode: "0644"
  notify: Restart spire-server
  tags:
    - docker-services
    - spire-server
    - spire-node-certs

- name: Ensure SPIRE Server container is running
  community.docker.docker_container:
    name: spire-server
    image: "{{ spire_server_image }}:{{ spire_server_image_version }}"
    state: started
    restart_policy: unless-stopped
    dns_servers:
      - "192.168.12.210"
    user: "{{ spire_server_uid }}:{{ spire_server_gid }}"
    ports:
      - "{{ spire_server_lan_ip }}:{{ spire_server_host_port }}:{{ spire_server_grpc_port }}"
      - "127.0.0.1:{{ spire_server_health_host_port }}:{{ spire_server_health_port }}"
    volumes:
      - "{{ spire_server_data_dir }}:{{ spire_server_data_dir_container }}"
      - "{{ spire_server_config_dir }}:{{ spire_server_config_dir_container }}:ro"
      # OPS-537 / OPS-351 Phase 4.4a — share API socket with oidc-discovery-provider sidecar
      - "{{ spire_server_admin_socket_host_dir }}:{{ spire_server_admin_socket_container_dir }}"
    command: "-config {{ spire_server_config_dir_container }}/server.conf"
  tags:
    - docker-services
    - spire-server

- name: OPS-352 Verify SPIRE Server health check post-deploy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spire_server_health_host_port }}/ready"
    status_code: [200]
    timeout: 5
  register: spire_health
  retries: 5
  delay: 6
  until: spire_health is succeeded
  failed_when:
    - spire_health.status != 200
  changed_when: false
  tags:
    - docker-services
    - spire-server

# --- SPIRE Agent (OPS-528 / Phase 4.2a; OPS-553 x509pop migration) ---
# Single SPIRE Agent on iac-control, sibling to the SPIRE Server above.
# OPS-553: NodeAttestor changed from join_token to x509pop.
# The agent presents a Vault-PKI-issued node cert at attestation time.
# Re-attestation is automatic on every container restart — no tokens, no state machine.

# ── x509pop cert provisioning for iac-control agent (OPS-553) ────────────────

- name: OPS-553 Check SPIRE Agent node cert on iac-control
  ansible.builtin.stat:
    path: "{{ spire_node_cert_file }}"
  register: spire_node_cert_stat_iac
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Check SPIRE Agent node cert expiry (if cert exists)
  ansible.builtin.command:
    cmd: >
      openssl x509 -in {{ spire_node_cert_file }}
      -noout -checkend 2592000
  register: spire_node_cert_expiry_iac
  changed_when: false
  failed_when: false
  when: spire_node_cert_stat_iac.stat.exists
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Determine if iac-control node cert needs issuance
  ansible.builtin.set_fact:
    spire_node_cert_needs_issue_iac: >-
      {{ (not spire_node_cert_stat_iac.stat.exists) or
         (spire_node_cert_expiry_iac is not skipped and
          spire_node_cert_expiry_iac.rc is defined and
          spire_node_cert_expiry_iac.rc != 0) }}
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Generate SPIRE node cert key on iac-control (controller-local temp)
  community.crypto.openssl_privatekey:
    path: "/tmp/spire-node-iac-control.key"
    type: RSA
    size: 2048
    mode: "0644"
  delegate_to: localhost
  # mode 0644 (not 0600) so that root-written key is readable by the ansible runner
  # (ubuntu) when lookup('file',...) executes. The key is a transient controller-local
  # temp file; it is deleted immediately after being written to the target host.
  # Final on-disk mode on the target is enforced by the Write task below (mode 0600).
  when: spire_node_cert_needs_issue_iac
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Generate SPIRE node cert CSR (iac-control)
  community.crypto.openssl_csr_pipe:
    privatekey_path: "/tmp/spire-node-iac-control.key"
    common_name: "iac-control.agents.haist.farm"
    extended_key_usage:
      - clientAuth
    use_common_name_for_san: false
  register: spire_node_csr_iac
  delegate_to: localhost
  changed_when: false
  when: spire_node_cert_needs_issue_iac
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Issue iac-control node cert from Vault spire-pki/
  ansible.builtin.uri:
    url: "https://vault.208.haist.farm/v1/{{ spire_node_vault_pki_mount }}/sign/{{ spire_node_vault_pki_role }}"
    method: POST
    headers:
      X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
      Content-Type: "application/json"
    body_format: json
    body:
      csr: "{{ spire_node_csr_iac.csr }}"
      common_name: "iac-control.agents.haist.farm"
      ttl: "8760h"
    validate_certs: true
    status_code: 200
    return_content: true
  register: spire_node_cert_response_iac
  delegate_to: localhost
  no_log: false
  when: spire_node_cert_needs_issue_iac
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Write iac-control node cert to disk
  # Write cert + issuing CA as a proper PEM chain (newline-separated, not space-joined).
  # The >- folded scalar would collapse newlines between the two blocks to a space,
  # which breaks strict PEM parsers (x509pop verification walks the chain).
  # Using a quoted double-quoted string with explicit \n ensures the boundary is correct.
  ansible.builtin.copy:
    dest: "{{ spire_node_cert_file }}"
    content: "{{ spire_node_cert_response_iac.json.data.certificate }}\n{{ spire_node_cert_response_iac.json.data.issuing_ca }}\n"
    owner: "{{ spire_agent_uid }}"
    group: "{{ spire_agent_gid }}"
    mode: "0644"
  when: spire_node_cert_needs_issue_iac
  notify: Restart spire-agent
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Write iac-control node cert key to disk
  ansible.builtin.copy:
    dest: "{{ spire_node_cert_key }}"
    content: "{{ lookup('file', '/tmp/spire-node-iac-control.key') }}"
    owner: "{{ spire_agent_uid }}"
    group: "{{ spire_agent_gid }}"
    mode: "0600"
  when: spire_node_cert_needs_issue_iac
  notify: Restart spire-agent
  no_log: true
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Remove temp iac-control node cert key from Ansible controller
  ansible.builtin.file:
    path: "/tmp/spire-node-iac-control.key"
    state: absent
  delegate_to: localhost
  when: spire_node_cert_needs_issue_iac
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: OPS-553 Verify iac-control node cert is valid PEM (openssl parse check)
  # Fails the play if the written cert file is not a valid X.509 PEM certificate.
  # Catches PEM concatenation bugs (space instead of newline between cert + CA)
  # and any Vault API response truncation before the agent ever tries to use it.
  # Runs unconditionally (not just when cert was just issued) so a corrupted cert
  # on disk is caught on every apply, not only at issuance time.
  ansible.builtin.command:
    cmd: "openssl x509 -in {{ spire_node_cert_file }} -noout"
  register: spire_node_cert_parse_iac
  changed_when: false
  failed_when: spire_node_cert_parse_iac.rc != 0
  tags:
    - docker-services
    - spire-agent
    - spire-node-certs

- name: Create SPIRE Agent config directory (also holds node cert/key for x509pop)
  ansible.builtin.file:
    path: "{{ spire_agent_config_dir }}"
    state: directory
    owner: "{{ spire_agent_uid }}"
    group: "{{ spire_agent_gid }}"
    mode: "{{ spire_agent_secret_dir_mode }}"
  tags:
    - docker-services
    - spire-agent

- name: Create SPIRE Agent data directory
  ansible.builtin.file:
    path: "{{ spire_agent_data_dir }}"
    state: directory
    owner: "{{ spire_agent_uid }}"
    group: "{{ spire_agent_gid }}"
    mode: "{{ spire_agent_dir_mode }}"
  tags:
    - docker-services
    - spire-agent

- name: Create SPIRE Agent Workload API socket directory
  # 0755 lets non-root workloads connect to the UDS in Phase 4.2b+. Phase 4.2a
  # has no workload entries yet so the only client today is operator inspection.
  ansible.builtin.file:
    path: "{{ spire_agent_socket_dir }}"
    state: directory
    owner: "{{ spire_agent_uid }}"
    group: "{{ spire_agent_gid }}"
    mode: "{{ spire_agent_socket_dir_mode }}"
  tags:
    - docker-services
    - spire-agent

- name: Fetch SPIRE trust bundle from running Server (PEM)
  # docker exec into the running spire-server to dump the current trust bundle.
  # This is the explicit trust anchor for first contact (avoids insecure_bootstrap).
  # changed_when:false because read-only; the Copy task downstream is the real
  # change detector if the bundle content actually differs.
  ansible.builtin.command:
    cmd: >
      docker exec spire-server /opt/spire/bin/spire-server bundle show
      -format pem
      -socketPath {{ spire_server_admin_socket_container }}
  register: spire_bundle_show
  changed_when: false
  failed_when: spire_bundle_show.rc != 0
  tags:
    - docker-services
    - spire-agent

- name: Write SPIRE trust bundle for Agent
  ansible.builtin.copy:
    dest: "{{ spire_agent_trust_bundle_path }}"
    content: "{{ spire_bundle_show.stdout }}\n"
    owner: "{{ spire_agent_uid }}"
    group: "{{ spire_agent_gid }}"
    mode: "0644"
  notify: Restart spire-agent
  tags:
    - docker-services
    - spire-agent

- name: Deploy SPIRE Agent configuration
  ansible.builtin.template:
    src: spire-agent.conf.j2
    dest: "{{ spire_agent_config_dir }}/agent.conf"
    owner: "{{ spire_agent_uid }}"
    group: "{{ spire_agent_gid }}"
    mode: "0600"
  notify: Restart spire-agent
  tags:
    - docker-services
    - spire-agent

- name: Verify SPIRE Agent image signature (supply-chain hygiene)
  # Same keyless-cosign pattern as SPIRE Server above; the spire-agent image
  # is signed by the same SPIFFE GHA workflow identity.
  ansible.builtin.command:
    cmd: >
      cosign verify
      --certificate-identity-regexp "^https://github.com/spiffe/spire/"
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      {{ spire_agent_image }}:{{ spire_agent_image_version }}
  register: spire_agent_cosign_verify
  changed_when: false
  failed_when: spire_agent_cosign_verify.rc != 0
  tags:
    - docker-services
    - spire-agent
    - supply-chain

# OPS-553: join_token bootstrap state machine REMOVED.
# x509pop agents re-attest on every restart using the node cert.
# No agent-data.json check, no SVID expiry check, no token generation.
# The node cert is provisioned by the --tags spire-node-certs tasks above.
# If the SVID expires while the container is stopped, the agent re-attests
# automatically via x509pop on the next start — no operator intervention.
#
# Note: if agent-data.json exists from a prior join_token deployment, it is
# harmless. The agent will try to use it; if the SVID is expired or the
# join_token parent entry is gone from the Server, x509pop attestation will
# be used instead (the agent falls through to re-attest via the configured
# NodeAttestor). The stale agent-data.json will be overwritten on success.

- name: Ensure SPIRE Agent container is running (x509pop — OPS-553)
  # network_mode: host — Server lives on the same iac-control host; agent
  # connects to {{ spire_server_lan_ip }}:{{ spire_server_host_port }} via the
  # local NIC. No docker-bridge NAT involved.
  #
  # OPS-553 x509pop change: command is now static (no -joinToken arg ever).
  # The agent re-attests on every restart using the node cert in spire_agent_config_dir.
  # The config dir bind-mount is changed to :rw (was :ro) so the agent can update
  # agent-data.json inside the config dir if needed — but node-cert.pem and agent.conf
  # are managed by Ansible and should not be overwritten by the agent.
  # Alternative: keep :ro and mount data_dir separately. We keep :ro for the conf dir
  # and note that node-cert.pem and node-key.pem are in the conf dir (read by agent
  # at startup, not written by agent). The agent writes agent-data.json to data_dir.
  community.docker.docker_container:
    name: spire-agent
    image: "{{ spire_agent_image }}:{{ spire_agent_image_version }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    # OPS-545 / Phase 4.5: pid_mode: host required so the Unix Workload
    # Attestor inside the container can SO_PEERCRED-resolve host processes
    # connecting to /run/spire-agent/agent.sock. Without it, the container's
    # /proc view doesn't include host PIDs and the attestor logs
    # `could not resolve caller information` → ALL external-workload
    # attestation fails.
    pid_mode: host
    user: "{{ spire_agent_uid }}"
    volumes:
      - "{{ spire_agent_data_dir }}:{{ spire_agent_data_dir_container }}"
      # Config dir: read-only from container perspective. Holds agent.conf,
      # trust_bundle.pem, node-cert.pem, node-key.pem (x509pop credentials).
      # The agent reads but does not write these files.
      - "{{ spire_agent_config_dir }}:{{ spire_agent_config_dir_container }}:ro"
      - "{{ spire_agent_socket_dir }}:{{ spire_agent_socket_dir }}"
      # OPS-545 / Phase 4.5: bind-mount host's NSS files so the Unix
      # Workload Attestor's user.LookupId(UID) / group.LookupId(GID) calls
      # resolve to the host's username/group name.
      # OPS-549 / Phase 4.6: DIRECTORY bind (not file bind) to survive atomic
      # renames when sentinel-* users are added via useradd.
      - "/etc:/etc:ro"
    # OPS-553: static command — no -joinToken flag ever. x509pop re-attest is automatic.
    command:
      - "-config"
      - "{{ spire_agent_config_dir_container }}/agent.conf"
  no_log: false
  tags:
    - docker-services
    - spire-agent

- name: OPS-528 Verify SPIRE Agent /ready post-deploy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ spire_agent_health_port }}/ready"
    status_code: [200]
    timeout: 5
  register: spire_agent_health
  retries: 12
  delay: 5
  until: spire_agent_health is succeeded
  changed_when: false
  tags:
    - docker-services
    - spire-agent
