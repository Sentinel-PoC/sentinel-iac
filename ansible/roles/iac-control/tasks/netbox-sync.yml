---
# NetBox Proxmox sync automation
# Syncs VM state from Proxmox API to NetBox IPAM
#
# OPS-303: NetBox + Proxmox API tokens MUST be sourced from Vault.
# Do NOT pass these as extra-vars, in inventory, or inline.
# Vault paths (KV v2 mount "secret"):
#   secret/netbox   key: admin_api_token
#   secret/proxmox  keys: api_token_id, api_token_secret
# Pattern mirrors ansible/roles/seedbox/tasks/main.yml (OPS-321 Phase 1).

- name: Fetch NetBox API token from Vault
  ansible.builtin.set_fact:
    vault_netbox_api_token: >-
      {{ lookup(
        'community.hashi_vault.vault_kv2_get',
        'netbox',
        url=vault_addr | default(lookup('env', 'VAULT_ADDR')),
        token=vault_token | default(lookup('env', 'VAULT_TOKEN'))
      ).secret.admin_api_token }}
  no_log: true
  when: vault_netbox_api_token | default('') | length == 0
  tags:
    - netbox

- name: Fetch Proxmox API token id from Vault
  ansible.builtin.set_fact:
    vault_proxmox_api_token_id: >-
      {{ lookup(
        'community.hashi_vault.vault_kv2_get',
        'proxmox',
        url=vault_addr | default(lookup('env', 'VAULT_ADDR')),
        token=vault_token | default(lookup('env', 'VAULT_TOKEN'))
      ).secret.api_token_id }}
  no_log: true
  when: vault_proxmox_api_token_id | default('') | length == 0
  tags:
    - netbox

- name: Fetch Proxmox API token secret from Vault
  ansible.builtin.set_fact:
    vault_proxmox_api_token_secret: >-
      {{ lookup(
        'community.hashi_vault.vault_kv2_get',
        'proxmox',
        url=vault_addr | default(lookup('env', 'VAULT_ADDR')),
        token=vault_token | default(lookup('env', 'VAULT_TOKEN'))
      ).secret.api_token_secret }}
  no_log: true
  when: vault_proxmox_api_token_secret | default('') | length == 0
  tags:
    - netbox

- name: Assert NetBox + Proxmox tokens are present before rendering env file
  ansible.builtin.assert:
    that:
      - vault_netbox_api_token | default('') | length > 0
      - vault_proxmox_api_token_id | default('') | length > 0
      - vault_proxmox_api_token_secret | default('') | length > 0
    fail_msg: >
      One or more NetBox/Proxmox tokens are empty. They must be in Vault before
      this role runs:
        vault kv get secret/netbox   (key: admin_api_token)
        vault kv get secret/proxmox  (keys: api_token_id, api_token_secret)
      Refusing to render /etc/sentinel/netbox-sync.env with empty/default values.
  tags:
    - netbox

- name: Create NetBox sync log directory
  ansible.builtin.file:
    path: /var/log/sentinel/netbox-sync
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - netbox

- name: Deploy NetBox sync script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/netbox-sync-proxmox.sh"
    dest: /usr/local/bin/netbox-sync-proxmox.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - netbox

- name: Deploy NetBox sync environment file
  ansible.builtin.template:
    src: netbox-sync.env.j2
    dest: /etc/sentinel/netbox-sync.env
    owner: root
    group: root
    mode: "0600"
  tags:
    - netbox

- name: Deploy NetBox sync systemd service
  ansible.builtin.template:
    src: netbox-sync-proxmox.service.j2
    dest: /etc/systemd/system/netbox-sync-proxmox.service
    owner: root
    group: root
    mode: "0644"
  notify: Daemon-reload
  tags:
    - netbox

- name: Deploy NetBox sync systemd timer
  ansible.builtin.template:
    src: netbox-sync-proxmox.timer.j2
    dest: /etc/systemd/system/netbox-sync-proxmox.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon-reload
    - Restart netbox-sync-timer
  tags:
    - netbox

- name: Enable and start NetBox sync timer
  ansible.builtin.systemd:
    name: netbox-sync-proxmox.timer
    state: "{{ 'started' if netbox_sync_enabled else 'stopped' }}"
    enabled: "{{ netbox_sync_enabled }}"
    daemon_reload: true
  tags:
    - netbox
