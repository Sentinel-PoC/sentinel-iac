    ('v' + cosign_version) not in cosign_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

# ────────────────────────────────────────────────────────────────────────────
# packer — infrastructure image builder (hashicorp/packer)
# OPS-935: packer-validate CI job was failing in 6-9s because packer binary
# was absent from the iac runner. ZIP distribution from releases.hashicorp.com.
# Requires unzip (present on Ubuntu via ansible.builtin.unarchive dependency).
# ────────────────────────────────────────────────────────────────────────────

- name: Check if packer is installed at pinned version
  ansible.builtin.command:
    cmd: /usr/local/bin/packer version
  register: packer_version_check
  changed_when: false
  failed_when: false
  tags:
    - iac-control
    - supply-chain-tooling

- name: Ensure unzip is installed (required for packer ZIP extraction)
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: false
  when: >
    packer_version_check.rc != 0 or
    packer_version not in packer_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Download packer ZIP (v{{ packer_version }})
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/packer/{{ packer_version }}/packer_{{ packer_version }}_linux_amd64.zip"
    dest: "/tmp/packer_{{ packer_version }}_linux_amd64.zip"
    checksum: "sha256:{{ packer_sha256 }}"
    mode: "0644"
  when: >
    packer_version_check.rc != 0 or
    packer_version not in packer_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Extract packer binary from ZIP
  ansible.builtin.unarchive:
    src: "/tmp/packer_{{ packer_version }}_linux_amd64.zip"
    dest: "/tmp/"
    remote_src: true
    include:
      - packer
  when: >
    packer_version_check.rc != 0 or
    packer_version not in packer_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Install packer binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/packer
    dest: /usr/local/bin/packer
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: >
    packer_version_check.rc != 0 or
    packer_version not in packer_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Clean up packer ZIP and extracted binary
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/packer_{{ packer_version }}_linux_amd64.zip"
    - "/tmp/packer"
  when: >
    packer_version_check.rc != 0 or
    packer_version not in packer_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

# ────────────────────────────────────────────────────────────────────────────
# Verification — assert all four tools are present at pinned versions
# ────────────────────────────────────────────────────────────────────────────

- name: Verify supply-chain tools installed at pinned versions
  ansible.builtin.shell: |
    set -o pipefail
    syft --version | grep -q 'v{{ syft_version }}'
    osv-scanner --version | grep -q '{{ osv_scanner_version }}'
    cosign version | grep -q 'v{{ cosign_version }}'
    packer version | grep -q '{{ packer_version }}'
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  register: verify_supply_chain_tools
  tags:
    - iac-control
    - supply-chain-tooling

- name: Fail if supply-chain tool verification failed
  ansible.builtin.fail:
    msg: "Supply-chain tools missing or wrong version (OPS-258/OPS-935). rc={{ verify_supply_chain_tools.rc }} stdout={{ verify_supply_chain_tools.stdout }} stderr={{ verify_supply_chain_tools.stderr }}"
  when: verify_supply_chain_tools.rc != 0
  tags:
    - iac-control
    - supply-chain-tooling
