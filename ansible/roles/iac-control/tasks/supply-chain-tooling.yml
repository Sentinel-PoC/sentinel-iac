    dest: "/tmp/cosign-linux-amd64"
    checksum: "sha256:{{ cosign_sha256 }}"
    mode: "0644"
  when: >
    cosign_version_check.rc != 0 or
    ('v' + cosign_version) not in cosign_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Install cosign binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/cosign-linux-amd64
    dest: /usr/local/bin/cosign
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: >
    cosign_version_check.rc != 0 or
    ('v' + cosign_version) not in cosign_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Clean up cosign download
  ansible.builtin.file:
    path: /tmp/cosign-linux-amd64
    state: absent
  when: >
