---
# supply-chain-tooling.yml — OPS-258
# Installs Syft, osv-scanner, cosign, and packer at pinned versions on the
# iac-control Forgejo runner host. Required before SEC-60/61/62 composite
# action (PR #66) merges — those workflows call all three binaries.
# OPS-935: packer added — required by .forgejo/workflows/packer.yml packer-validate job.
#
# Install strategy:
#  1. Stat the binary; capture version output if it exists.
#  2. Skip download if binary is present at the expected version.
#  3. Otherwise: get_url with SHA256 checksum (supply-chain hygiene).
#  4. Extract tarball/zip; move binary to /usr/local/bin; chmod 0755.
#  5. Assert all tools report the pinned versions at the end.

# ────────────────────────────────────────────────────────────────────────────
# Syft — SBOM generator (anchore/syft)
# ────────────────────────────────────────────────────────────────────────────

- name: Check if syft is installed at pinned version
  ansible.builtin.command:
    cmd: /usr/local/bin/syft --version
  register: syft_version_check
  changed_when: false
  failed_when: false
  tags:
    - iac-control
    - supply-chain-tooling

- name: Download syft tarball (v{{ syft_version }})
  ansible.builtin.get_url:
    url: "https://github.com/anchore/syft/releases/download/v{{ syft_version }}/syft_{{ syft_version }}_linux_amd64.tar.gz"
    dest: "/tmp/syft_{{ syft_version }}_linux_amd64.tar.gz"
    checksum: "sha256:{{ syft_sha256 }}"
    mode: "0644"
  when: >
    syft_version_check.rc != 0 or
    ('v' + syft_version) not in syft_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Extract syft binary from tarball
  ansible.builtin.unarchive:
    src: "/tmp/syft_{{ syft_version }}_linux_amd64.tar.gz"
    dest: "/tmp/"
    remote_src: true
    include:
      - syft
  when: >
    syft_version_check.rc != 0 or
    ('v' + syft_version) not in syft_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Install syft binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/syft
    dest: /usr/local/bin/syft
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: >
    syft_version_check.rc != 0 or
    ('v' + syft_version) not in syft_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Clean up syft tarball and extracted binary
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/syft_{{ syft_version }}_linux_amd64.tar.gz"
    - "/tmp/syft"
  when: >
    syft_version_check.rc != 0 or
    ('v' + syft_version) not in syft_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

# ────────────────────────────────────────────────────────────────────────────
# osv-scanner — vulnerability scanner (google/osv-scanner)
# ────────────────────────────────────────────────────────────────────────────

