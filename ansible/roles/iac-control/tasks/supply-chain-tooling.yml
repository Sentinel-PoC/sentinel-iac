    dest: "/tmp/osv-scanner_linux_amd64"
    checksum: "sha256:{{ osv_scanner_sha256 }}"
    mode: "0644"
  when: >
    osv_version_check.rc != 0 or
    osv_scanner_version not in osv_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Install osv-scanner binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/osv-scanner_linux_amd64
    dest: /usr/local/bin/osv-scanner
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: >
    osv_version_check.rc != 0 or
    osv_scanner_version not in osv_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

- name: Clean up osv-scanner download
  ansible.builtin.file:
    path: /tmp/osv-scanner_linux_amd64
    state: absent
  when: >
    osv_version_check.rc != 0 or
    osv_scanner_version not in osv_version_check.stdout
  tags:
    - iac-control
    - supply-chain-tooling

# ────────────────────────────────────────────────────────────────────────────
# cosign — container signing + verification (sigstore/cosign)
# Installed if missing or version < 2.4.3. Does NOT downgrade.
# ────────────────────────────────────────────────────────────────────────────

- name: Check if cosign is installed at pinned version
  ansible.builtin.command:
    cmd: /usr/local/bin/cosign version
  register: cosign_version_check
  changed_when: false
