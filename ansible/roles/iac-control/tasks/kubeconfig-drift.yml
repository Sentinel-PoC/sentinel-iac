---
# OPS-450: Remove stale okd-sandbox references from iac-control
# Ensures idempotent cleanup after cluster rename okd-sandbox → overwatch
# Run with: ansible-playbook ansible/playbooks/iac-control.yml --tags kubeconfig-drift

# --- /etc/hosts cleanup ---
# These 3 lines were added manually in OPS-186 and are now stale.
# DNS is served by dnsmasq (overwatch.conf); /etc/hosts entries are redundant.

- name: Remove stale okd-sandbox API host entry from /etc/hosts (OPS-450)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "192.168.12.223 api.okd-sandbox.sandbox.208.haist.farm"
    state: absent
  become: true
  tags:
    - kubeconfig-drift
    - hosts-cleanup

- name: Remove stale okd-sandbox oauth host entry from /etc/hosts (OPS-450)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "192.168.12.224 oauth-openshift.apps.okd-sandbox.sandbox.208.haist.farm"
    state: absent
  become: true
  tags:
    - kubeconfig-drift
    - hosts-cleanup

- name: Remove stale okd-sandbox console host entry from /etc/hosts (OPS-450)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "192.168.12.224 console-openshift-console.apps.okd-sandbox.sandbox.208.haist.farm"
    state: absent
  become: true
  tags:
    - kubeconfig-drift
    - hosts-cleanup

- name: Remove stale OPS-186 comment line from /etc/hosts (OPS-450)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "# OPS-186 OKD sandbox cluster (added by Phase 2 worker)"
    state: absent
  become: true
  tags:
    - kubeconfig-drift
    - hosts-cleanup

# --- dnsmasq cleanup ---
# /etc/dnsmasq.d/okd-sandbox.conf was deployed during OPS-293 recovery.
# The overwatch.conf already provides correct DNS entries for the cluster.
# conf-dir=/etc/dnsmasq.d (no *.conf filter) — ALL files in this dir are read.
# This task ensures the stale config is absent so Ansible runs idempotently.

- name: Ensure stale okd-sandbox dnsmasq config is absent (OPS-450)
  ansible.builtin.file:
    path: /etc/dnsmasq.d/okd-sandbox.conf
    state: absent
  become: true
  notify: Restart dnsmasq
  tags:
    - kubeconfig-drift
    - dnsmasq-cleanup

# --- ~/.kube/config kubeconfig symlink ---
# Authoritative kubeconfig: /home/ubuntu/overwatch-repo/auth/kubeconfig
# Contains system:admin context with non-expiring client cert (admin CA).
# ~/.kube/config was previously pointing at api.okd-sandbox.sandbox.208.haist.farm.

- name: Ensure ~/.kube directory exists for ubuntu (OPS-450)
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"
  tags:
    - kubeconfig-drift

- name: Symlink ~/.kube/config to authoritative overwatch kubeconfig (OPS-450)
  ansible.builtin.file:
    src: /home/ubuntu/overwatch-repo/auth/kubeconfig
    dest: /home/ubuntu/.kube/config
    state: link
    owner: ubuntu
    group: ubuntu
    force: true
  tags:
    - kubeconfig-drift
