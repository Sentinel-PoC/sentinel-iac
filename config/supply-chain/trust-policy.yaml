      '
    compensating_controls:
    - 'SEC-61: OSV-Scanner + Trivy at mirror time'
    - Pinned tag :26.6.2 (bumped from :26.0 by OPS-865 2026-06-01; fixes session-fixation ATO, CVE-2026-33870 req-smuggling, HTTP/2 DoS, stored XSS; cosign verify exit 0 sha256:40007b80367d48a3268ae4c9b5ec9c9aa530bc801e9f6ae27f2b6727dec7bf94)
    - 'Action: digest-pin; keycloak is auth infrastructure'
    reviewed_by: worker-ops865 2026-06-01 session (keycloak bump to 26.6.2)
    review_date: '2026-06-01'
    next_review_date: '2026-09-01'
