upstream_keys:
  falcosidekick:
    source: docker.io/falcosecurity/falcosidekick
    harbor_target: sentinel/falcosidekick
    method: cosign-keyless
    certificate_oidc_issuer: https://token.actions.githubusercontent.com
    certificate_identity_regexp: ^https://github\.com/falcosecurity/falcosidekick/\.github/workflows/release\.yml@refs/tags/.*
    notes: 'falcosecurity/falcosidekick signs release tags via GitHub Actions Sigstore
      keyless (release.yml workflow). Subject pattern matches refs/tags/* pushed by
      the falcosecurity/falcosidekick repo. Discovery context: SEC-87 supply-chain
      design 2026-05-30; SEC-99 residual image triage.

      '
    last_verified: '2026-05-30'
    verified_by: worker SEC-99 triage
  synapse:
    source: docker.io/matrixdotorg/synapse
    harbor_target: sentinel/synapse
    method: cosign-keyless
    certificate_oidc_issuer: https://token.actions.githubusercontent.com
    certificate_identity_regexp: https://github\.com/element-hq/synapse/.+
    # yamllint disable-line rule:line-length
    notes: 'element-hq/synapse GitHub Actions workflow docker.yml signs at every tag push via Sigstore keyless. Verified live on 2026-04-19 with cosign v2.4.3. Digest sha256:89b1f98ae38 confirmed signed as of v1.139.2.

      '
    last_verified: '2026-04-19'
    verified_by: worker SEC-64 live check
  element-web:
    source: docker.io/vectorim/element-web
    harbor_target: sentinel/element-web
    method: cosign-keyless
    certificate_oidc_issuer: https://token.actions.githubusercontent.com
    certificate_identity_regexp: https://github\.com/element-hq/element-web/.+
    # yamllint disable-line rule:line-length
    notes: 'element-hq/element-web GitHub Actions workflow docker.yaml signs at every tag push via Sigstore keyless. Verified live on 2026-04-19 with cosign v2.4.3. Digest sha256:f6b3ce26c42 confirmed signed as of v1.12.11.

      '
    last_verified: '2026-04-19'
    verified_by: worker SEC-64 live check
  falco:
    source: docker.io/falcosecurity/falco
    harbor_target: sentinel/falco
    method: cosign-keyless
    certificate_oidc_issuer: https://token.actions.githubusercontent.com
    certificate_identity_regexp: https://github\.com/falcosecurity/falco/.github/workflows/reusable_publish_docker\.yaml@refs/tags/.+
    notes: 'falcosecurity/falco signs every release tag via GitHub Actions Sigstore
      keyless. Verified live on 2026-04-24 on iac-control with cosign verify (tlog
      required; --insecure-ignore-tlog returns expired-cert error which is expected
      for older tags). Subject at 0.43.1: https://github.com/falcosecurity/falco/.github/workflows/reusable_publish_docker.yaml@refs/tags/0.43.1;
      Issuer: https://token.actions.githubusercontent.com. Discovery context: OPS-139
      audit (SEC-39).

      '
    last_verified: '2026-04-24'
    verified_by: worker SEC-39 live check on iac-control
exceptions:
  postgres:
    source: docker.io/library/postgres
    harbor_target: sentinel/postgres
    # yamllint disable-line rule:line-length
    rationale: 'Docker Official Library does not publish Cosign/Sigstore signatures as of 2026-04. Build pipeline is audited by Docker, Inc. and published from github.com/docker-library/postgres. cosign tree returns no supply chain artifacts.

      '
    compensating_controls:
    - 'SEC-61: OSV-Scanner + Trivy at mirror time'
    - Pinned tag :16 (not :latest)
    reviewed_by: operator (Jim) 2026-04-19 session authorization
    review_date: '2026-04-19'
    next_review_date: '2026-07-19'
  keycloak:
    source: quay.io/keycloak/keycloak
