---
# OPS-409: AGENT-STATE.md shrink guard
#
# Context: Workers must append to AGENT-STATE.md, never overwrite (OPS-599, CLAUDE.md §session-end).
# PR #137 (OPS-319) overwrote 388 lines → 96 lines, destroying accumulated session history.
# OPS-599 added the append-only rule to CLAUDE.md. This CI check enforces it mechanically:
# if AGENT-STATE.md shrinks (PR version has fewer lines than base), the job fails.
#
# Scope: PR-only. Not run on push to main (the shrink already landed; catching it in main
# is forensic not preventive). Does nothing if AGENT-STATE.md is not modified in the PR.
#
# Runner: iac — standard sentinel-iac runner (no privileged access needed; pure git operation).
#
# False positives:
# - A legitimate "compact / clean" of AGENT-STATE.md by an operator would trip this guard.
#   That is intentional — such a reduction should be deliberate and verifiable in CI output.
#   The judge or operator can override by force-merge after reviewing the diff.
# - If AGENT-STATE.md does not exist on the base branch, the guard exits 0 (first-ever commit).
#
# NIST: CM-3(2) — Change control with automated checking.
name: agent-state-guard

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-state-shrink-check:
    runs-on: iac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AGENT-STATE.md for shrinkage
        run: |
          set -euo pipefail

          # Determine base and head refs
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA: ${BASE_SHA}"
          echo "Head SHA: ${HEAD_SHA}"

          # Check if AGENT-STATE.md is modified in this PR
          if ! git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -q '^AGENT-STATE\.md$'; then
            echo "AGENT-STATE.md not modified in this PR — guard skipped (OK)"
            exit 0
          fi

          echo "AGENT-STATE.md is modified in this PR — running shrink check"

          # Check if the file exists on base (handles first-ever commit edge case)
          if ! git show "${BASE_SHA}:AGENT-STATE.md" > /dev/null 2>&1; then
            echo "AGENT-STATE.md does not exist on base branch — first commit, guard skipped (OK)"
            exit 0
          fi

          BASE_LINES=$(git show "${BASE_SHA}:AGENT-STATE.md" | wc -l)
          HEAD_LINES=$(git show "${HEAD_SHA}:AGENT-STATE.md" | wc -l)

          echo "Base line count : ${BASE_LINES}"
          echo "Head line count : ${HEAD_LINES}"

          DELTA=$(( HEAD_LINES - BASE_LINES ))
          echo "Delta           : ${DELTA}"

          if [ "${HEAD_LINES}" -lt "${BASE_LINES}" ]; then
            echo ""
            echo "::error::AGENT-STATE.md SHRINK DETECTED"
            echo "::error::Base has ${BASE_LINES} lines; PR head has ${HEAD_LINES} lines (delta ${DELTA})."
            echo "::error::AGENT-STATE.md is append-only (OPS-409, OPS-599, CLAUDE.md §session-end)."
            echo "::error::Workers must PREPEND their session entry at the top, never overwrite."
            echo "::error::If this shrink is intentional (e.g. operator cleanup), contact the judge for force-merge."
            exit 1
          fi

          echo ""
          echo "AGENT-STATE.md size is OK (${BASE_LINES} → ${HEAD_LINES} lines, delta +${DELTA})"
          exit 0
