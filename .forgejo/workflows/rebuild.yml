---
name: Rebuild VM
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'VM to rebuild (iac-control, vault, minio, seedbox, config-server, crowdsec, wazuh, forgejo)'
        required: true
      forgejo_migrate_capital_k:
        description: 'forgejo target only: set "true" to run the one-time OPS-188 OIDC auth-source canonicalisation (Keycloak -> keycloak)'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_FORCE_COLOR: "true"

jobs:
  rebuild:
    runs-on: iac
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild VM
        env:
          # Vault access for roles that fetch secrets mid-run (proxmox-snapshot
          # Proxmox API token, keepalived VRRP password, etc). Matches the
          # DR workflow which uses VAULT_ROOT_TOKEN. The iac-control role's
          # tasks delegate to localhost and use this env via vault CLI.
          VAULT_ADDR: "https://vault.208.haist.farm"
          VAULT_TOKEN: ${{ secrets.VAULT_ROOT_TOKEN }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          PANGOLIN_SERVER_SECRET: ${{ secrets.PANGOLIN_SERVER_SECRET }}
          NEWT_ID: ${{ secrets.NEWT_ID }}
          NEWT_SECRET: ${{ secrets.NEWT_SECRET }}
          FORGEJO_DB_PASSWORD: ${{ secrets.FORGEJO_DB_PASSWORD }}
          FORGEJO_OIDC_CLIENT_SECRET: ${{ secrets.FORGEJO_OIDC_CLIENT_SECRET }}
          GITLAB_OIDC_CLIENT_SECRET: ${{ secrets.GITLAB_OIDC_CLIENT_SECRET }}
          KEYCLOAK_ADMIN_USER: ${{ secrets.KEYCLOAK_ADMIN_USER }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          FORGEJO_MIGRATE_CAPITAL_K: ${{ github.event.inputs.forgejo_migrate_capital_k }}
        run: |
          TARGET="${{ github.event.inputs.target }}"
          cd ansible

          case "$TARGET" in
            iac-control)
              ansible-playbook -i inventory/hosts.ini playbooks/iac-control.yml
              ;;
            vault)
              ansible-playbook -i inventory/hosts.ini playbooks/vault-server.yml
              ;;
            minio)
              ansible-playbook -i inventory/hosts.ini playbooks/minio-bootstrap.yml
              ;;
            seedbox)
              ansible-playbook -i inventory/hosts.ini playbooks/seedbox-vm.yml
              ;;
            config-server)
              ansible-playbook -i inventory/hosts.ini playbooks/config-server.yml
              ;;
            crowdsec)
              ansible-playbook -i inventory/hosts.ini playbooks/crowdsec.yml
              ;;
            wazuh)
              ansible-playbook -i inventory/hosts.ini playbooks/wazuh-server.yml
              ;;
            forgejo)
              EXTRA_ARGS=()
              if [ -n "${KEYCLOAK_ADMIN_USER:-}" ]; then
                EXTRA_ARGS+=(-e "keycloak_admin_user=${KEYCLOAK_ADMIN_USER}")
              fi
              if [ -n "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
                EXTRA_ARGS+=(-e "keycloak_admin_password=${KEYCLOAK_ADMIN_PASSWORD}")
              fi
              if [ "${FORGEJO_MIGRATE_CAPITAL_K:-false}" = "true" ]; then
                # OPS-188 one-time auth-source canonicalisation; only runs when
                # this input is set. 'never'-tagged tasks require explicit --tags.
                EXTRA_ARGS+=(-e "forgejo_oidc_migrate_capital_k=true")
                EXTRA_ARGS+=(--tags "forgejo,keycloak,oidc,auth-source,oidc-migration")
              fi
              # OPS-48: forgejo_db_password and forgejo_oidc_client_secret are
              # no longer passed as -e CLI args (which expose secrets in process
              # listings). The role defaults now read them via lookup('env', ...)
              # from the FORGEJO_DB_PASSWORD / FORGEJO_OIDC_CLIENT_SECRET env
              # vars already set above in the step env block.
              ansible-playbook -i inventory/hosts.ini playbooks/forgejo-server.yml \
                "${EXTRA_ARGS[@]}"
              ;;
            *)
              echo "Unknown target: $TARGET"
              echo "Valid targets: iac-control, vault, minio, seedbox, config-server, crowdsec, wazuh, forgejo"
              exit 1
              ;;
          esac
