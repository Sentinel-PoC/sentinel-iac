---
# OKD production cluster — upgrade pipeline.
#
# This is the prod variant of okd-upgrade-sandbox.yaml. It is deliberately a
# near-clone with env diffs only — same shared `lib/upgrade-functions.sh`,
# same phase ordering, same artefact + notify shape. The differences:
#
#   * Triggers on `infrastructure/okd-prod/cluster-version.yaml` (which
#     does not exist yet — will be created when prod is wired into this
#     pipeline; until then this workflow is dormant on push).
#   * Targets the production cluster's kubeconfig in Vault
#     (`secret/okd-prod` field `kubeconfig`).
#   * Tighter MCP budgets default (real workloads, longer drains).
#   * Plane tracking issue points at the prod-rehearsal task once filed.
#
# Per OPS-269 PIVOT: "Production workflow can be a stub copy initially;
# the sandbox workflow is the priority deliverable." This file IS that
# stub — it satisfies the deliverable so prod-day is a config edit, not a
# from-scratch authoring exercise.

name: OKD Upgrade — Production

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/okd-prod/cluster-version.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run preflight + validate only; SKIP upgrade phase. Default true for prod safety.'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      allow_not_recommended:
        description: 'Pass --allow-not-recommended to oc adm upgrade. Default false for prod (must be in graph).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: okd-upgrade-prod
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: iac
    timeout-minutes: 360
    env:
      VAULT_ADDR: https://vault.208.haist.farm
      VAULT_TOKEN: ${{ secrets.VAULT_ROOT_TOKEN }}
      PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
      PLANE_WORKSPACE: haists-it-consulting
      PLANE_PROJECT_ID: 223c0b66-4255-406e-932f-3b50c0e93543
      # FIXME-prod-day: replace with the production-upgrade tracking issue
      # (task #12 once it has a Plane id), not OPS-269.
      UPGRADE_TRACKING_ISSUE: 46b708cd-7045-4297-b8ce-4a2511448d0b
      CLUSTER_VERSION_FILE: infrastructure/okd-prod/cluster-version.yaml
      VAULT_KUBECONFIG_PATH: secret/okd-prod
      VAULT_KUBECONFIG_FIELD: kubeconfig
      # Prod is busier; stricter freshness on backups, longer per-MCP budget.
      ETCD_BACKUP_MAX_AGE_HOURS: '12'
      MASTER_MCP_BUDGET_MIN: '90'
      WORKER_MCP_BUDGET_MIN: '180'
      OPERATOR_STUCK_BUDGET_MIN: '45'
      ETCD_LATENCY_MAX_MS: '50'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      # Prod default false: target MUST be in the graph for prod safety.
      ALLOW_NOT_RECOMMENDED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_not_recommended || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bail if cluster-version file missing
        # Production cluster-version.yaml does not exist yet (OPS-269 ships
        # the sandbox workflow first; prod is a follow-up). Make this clear
        # rather than failing inside oc adm.
        # Sets PROD_FILE_ABSENT=true in GITHUB_ENV so all subsequent steps
        # (except notify) gate on it and are skipped cleanly.
        run: |
          if [[ ! -f "${CLUSTER_VERSION_FILE}" ]]; then
            echo "::warning::${CLUSTER_VERSION_FILE} does not exist — workflow runs only when prod target is committed."
            echo "PROD_FILE_ABSENT=true" >> "${GITHUB_ENV}"
            {
              echo "## Skipped — prod cluster-version.yaml not committed"
              echo "Commit \`${CLUSTER_VERSION_FILE}\` to enable the production upgrade pipeline."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

      - name: Pull kubeconfig from Vault
        if: env.PROD_FILE_ABSENT != 'true'
        run: |
          set -euo pipefail
          # IMPORTANT: write to a workflow-private path, never to ${HOME}/.kube/config.
          # On iac-control the forgejo-runner runs as user `ubuntu`, whose
          # ~/.kube/config is a SYMLINK to /home/ubuntu/overwatch-repo/auth/kubeconfig
          # — the operator's persistent kubeconfig. A naive `> ${HOME}/.kube/config`
          # follows the symlink and truncates the operator's working kubeconfig.
          # When VAULT_ADDR was the Pangolin route (pre-PR#219), vault returned
          # 403 + empty output, and this exact failure mode zeroed-out the
          # operator's kubeconfig mid-session.
          KCFG="${RUNNER_TEMP:-/tmp}/okd-upgrade-prod-kubeconfig-${GITHUB_RUN_ID}"
          : > "${KCFG}"
          chmod 0600 "${KCFG}"
          vault kv get -field="${VAULT_KUBECONFIG_FIELD}" "${VAULT_KUBECONFIG_PATH}" \
            > "${KCFG}"
          # Guard: vault v1.21.3 exits 0 on 403 (invalid-token / policy denied);
          # the redirect writes an empty file. set -euo pipefail does NOT catch
          # this. Fail here with a clear message rather than propagating an empty
          # kubeconfig into every subsequent oc call (which also exits 0 silently).
          if [[ ! -s "${KCFG}" ]]; then
            echo "::error::Empty kubeconfig after vault kv get — vault step failed silently (likely token policy/expiry, or VAULT_ADDR pointing at Pangolin SSO route which 403s tokens). Aborting."
            echo "## Vault step failed silently (empty kubeconfig)" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "KUBECONFIG=${KCFG}" >> "${GITHUB_ENV}"
          echo "DIAGNOSTICS_DIR=${RUNNER_TEMP:-/tmp}/okd-upgrade-prod-diag-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Show cluster + target
        if: env.PROD_FILE_ABSENT != 'true'
        run: |
          set -euo pipefail
          oc whoami
          oc get clusterversion
          cat "${CLUSTER_VERSION_FILE}"

      - name: Phase 1 — preflight
        if: env.PROD_FILE_ABSENT != 'true'
        run: |
          set -euo pipefail
          source .forgejo/workflows/lib/upgrade-functions.sh
          upgrade::_init_defaults
          TARGET_IMAGE=$(upgrade::desired_image)
          TARGET_VERSION=$(upgrade::desired_version)
          echo "TARGET_IMAGE=${TARGET_IMAGE}"     >> "${GITHUB_ENV}"
          echo "TARGET_VERSION=${TARGET_VERSION}" >> "${GITHUB_ENV}"
          # NOOP-detect: if cluster already runs the target digest, exit 0
          # immediately. Sets NOOP=true in GITHUB_ENV so phases 2-4 are skipped.
          if upgrade::is_noop "${TARGET_IMAGE}"; then
            exit 0
          fi

          upgrade::check_etcd_backup_age
          upgrade::check_no_mcp_paused
          upgrade::check_cluster_health
          upgrade::check_target_in_graph "${TARGET_IMAGE}" "${TARGET_VERSION}"
          if upgrade::check_already_in_progress "${TARGET_IMAGE}"; then
            echo "ALREADY_IN_PROGRESS=true" >> "${GITHUB_ENV}"
          fi

      - name: Phase 2 — initiate upgrade
        if: env.DRY_RUN != 'true' && env.ALREADY_IN_PROGRESS != 'true' && env.NOOP != 'true' && env.PROD_FILE_ABSENT != 'true'
        run: |
          set -euo pipefail
          source .forgejo/workflows/lib/upgrade-functions.sh
          upgrade::_init_defaults
          upgrade::initiate_upgrade "${TARGET_IMAGE}"
          echo "## Upgrade initiated (PROD)" >> "${GITHUB_STEP_SUMMARY}"
          echo "* target: \`${TARGET_VERSION}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "* image:  \`${TARGET_IMAGE}\`"   >> "${GITHUB_STEP_SUMMARY}"

      - name: Phase 2 — DRY RUN (skip)
        if: env.DRY_RUN == 'true' && env.NOOP != 'true' && env.PROD_FILE_ABSENT != 'true'
        run: |
          echo "::notice::DRY_RUN=true — Phase 2 (initiate upgrade) skipped."

      - name: Phase 3 — poll until complete
        if: env.DRY_RUN != 'true' && env.NOOP != 'true' && env.PROD_FILE_ABSENT != 'true'
        run: |
          set -euo pipefail
          source .forgejo/workflows/lib/upgrade-functions.sh
          upgrade::_init_defaults
          CV_BUDGET=$(( MASTER_MCP_BUDGET_MIN + WORKER_MCP_BUDGET_MIN + OPERATOR_STUCK_BUDGET_MIN ))
          if ! upgrade::poll_clusterversion "${TARGET_VERSION}" "${CV_BUDGET}"; then
            upgrade::dump_diagnostics "clusterversion-poll-budget-exceeded"
            exit 1
          fi
          if ! upgrade::poll_mcps; then
            upgrade::dump_diagnostics "mcp-poll-budget-exceeded"
            exit 1
          fi

      - name: Phase 4 — validate
        if: env.NOOP != 'true' && env.PROD_FILE_ABSENT != 'true'
        run: |
          set -euo pipefail
          source .forgejo/workflows/lib/upgrade-functions.sh
          upgrade::_init_defaults
          if [[ "${DRY_RUN}" == "true" ]]; then
            CHECK_VERSION=$(oc get clusterversion version -o jsonpath='{.status.history[0].version}')
          else
            CHECK_VERSION="${TARGET_VERSION}"
          fi
          if ! upgrade::validate_post "${CHECK_VERSION}"; then
            upgrade::dump_diagnostics "validate-failed"
            exit 1
          fi

      - name: Upload diagnostics (on failure)
        if: failure() && env.PROD_FILE_ABSENT != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: okd-upgrade-prod-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.DIAGNOSTICS_DIR }}/

      - name: Phase 5 — notify Plane
        if: always()
        env:
          OUTCOME: ${{ job.status == 'success' && 'PASS' || 'FAIL' }}
        run: |
          set -euo pipefail
          source .forgejo/workflows/lib/upgrade-functions.sh
          upgrade::_init_defaults
          BODY="<p><strong>Job status:</strong> ${{ job.status }} (PRODUCTION)</p>"
          if [[ "${PROD_FILE_ABSENT:-false}" == "true" ]]; then
            BODY="${BODY}<p><em>Skipped — <code>${CLUSTER_VERSION_FILE}</code> not committed. Prod upgrade pipeline is dormant until prod target is defined.</em></p>"
          elif [[ "${NOOP:-false}" == "true" ]]; then
            BODY="${BODY}<p><em>NOOP — target digest already deployed on cluster; no upgrade action taken. All upgrade phases skipped.</em></p>"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            BODY="${BODY}<p><em>DRY RUN — preflight + validate ran; upgrade phase skipped.</em></p>"
          fi
          if [[ "${OUTCOME}" == "FAIL" ]]; then
            BODY="${BODY}<p><strong>Diagnostics artefact:</strong> okd-upgrade-prod-diagnostics-${{ github.run_id }} (see workflow run page).</p>"
          fi
          upgrade::post_plane_comment "${OUTCOME}" "${BODY}"

      # Telegram is observability, not a gate. Missing secret → warn and continue.
      - name: Phase 5 — notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status == 'success' && 'PASS' || 'FAIL' }}
        run: |
          set -uo pipefail
          # Fail gracefully if secrets are absent.
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]] || [[ -z "${TELEGRAM_OPS_CHAT_ID:-}" ]]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_OPS_CHAT_ID not set — skipping Telegram notify."
            echo "## Telegram notify skipped (secrets not configured)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # HTML-escape a string (handles < > & in version labels / run titles).
          html_escape() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          DRY_TAG=""
          if [[ "${DRY_RUN}" == "true" ]]; then
            DRY_TAG=" [DRY RUN]"
          fi

          FROM_VER=$(oc get clusterversion version \
            -o jsonpath='{.status.history[?(@.state=="Completed")].version}' 2>/dev/null \
            | awk '{print $NF}' || echo "unknown")
          FROM_ESC=$(html_escape "${FROM_VER}")
          TO_ESC=$(html_escape "${TARGET_VERSION:-unknown}")
          RUN_ESC=$(html_escape "${RUN_URL}")

          if [[ "${OUTCOME}" == "PASS" ]]; then
            MSG=$(printf '<b>OKD Upgrade PASS%s</b>\nCluster: prod\nTransition: <code>%s</code> \xe2\x86\x92 <code>%s</code>\nRun: %s' \
              "${DRY_TAG}" "${FROM_ESC}" "${TO_ESC}" "${RUN_ESC}")
          else
            # Capture the first non-empty error line from GITHUB_STEP_SUMMARY if available.
            TOP_ERR=$(grep -m1 '::error' "${GITHUB_STEP_SUMMARY:-/dev/null}" 2>/dev/null \
              | sed 's/::error[^:]*:://' | cut -c1-120 || true)
            TOP_ESC=$(html_escape "${TOP_ERR:-see diagnostics artefact}")
            ARTEFACT_ESC=$(html_escape "okd-upgrade-prod-diagnostics-${{ github.run_id }}")
            MSG=$(printf '<b>OKD Upgrade FAIL%s</b>\nCluster: prod\nError: <code>%s</code>\nArtefact: <code>%s</code>\nRun: %s' \
              "${DRY_TAG}" "${TOP_ESC}" "${ARTEFACT_ESC}" "${RUN_ESC}")
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"chat_id\":\"${TELEGRAM_OPS_CHAT_ID}\",\"parse_mode\":\"HTML\",\"text\":$(printf '%s' "${MSG}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "::warning::Telegram notify returned HTTP ${HTTP_STATUS} — message not delivered."
            echo "## Telegram notify failed (HTTP ${HTTP_STATUS})" >> "${GITHUB_STEP_SUMMARY}"
          fi
          # Always exit 0 — Telegram failure must never block an upgrade outcome.
          exit 0
